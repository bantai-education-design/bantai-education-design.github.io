name: University reference visual preview
on:
  push:
    branches: [feature/university-reference-rebuild]
  pull_request:
    paths:
      - 'tools/university-database/tokyo/**'
      - '.github/workflows/university-reference-preview.yml'
jobs:
  visual-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/university-preview-server.log 2>&1 &
          sleep 2
      - name: Capture reference viewports
        run: |
          mkdir -p visual-preview
          node <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const cases = [
              [1535,1024,'tokyo-1535x1024.png'],
              [1024,1100,'tokyo-1024x1100.png'],
              [375,1200,'tokyo-375x1200.png']
            ];
            for (const [width,height,name] of cases) {
              const page = await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror', e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/', {waitUntil:'networkidle'});
              await page.screenshot({path:`visual-preview/${name}`, fullPage:false});
              if (errors.length) throw new Error(`${name}: ${errors.join('\n')}`);
              await page.close();
            }
            await browser.close();
          })();
          EOF
      - name: Basic DOM regression gate
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1535,height:1024}});
            await p.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            const checks={
              journey: await p.locator('.ref-step').count(),
              fields: await p.locator('.discovery-card').count(),
              grid: await p.locator('#tokyo-grid').count(),
              compare: await p.locator('#compare').count()
            };
            if(checks.journey!==4 || checks.fields!==6 || checks.grid!==1 || checks.compare!==1) throw new Error(JSON.stringify(checks));
            await b.close();
          })();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: university-reference-preview
          path: visual-preview/*.png
          if-no-files-found: error
