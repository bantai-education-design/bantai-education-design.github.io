name: Restore approved watercolor image once
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  restore-exact-original:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Rebuild unmodified original image from fragments
        shell: bash
        run: |
          set -euo pipefail
          dest="assets/images/columns/victor-pioneer-sound-and-picture-memory-2026/thumbnail.png"
          mkdir -p "$(dirname "$dest")"
          cat .image-restore/victor-pioneer/chunk*.txt | base64 --decode > "$dest"
          echo "f9aca9778c6e56ad991a39356b44dae4da6ce102e87753a731d86396a0f82bc9  $dest" | sha256sum -c -
          file "$dest"
      - name: Commit only exact approved original image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/columns/victor-pioneer-sound-and-picture-memory-2026/thumbnail.png
          git rm -r .image-restore/victor-pioneer
          git rm .github/workflows/restore-victor-pioneer-image.yml
          git commit -m "Restore approved original watercolor PNG, verified by SHA-256"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
