name: Apply Tokyo photo batch 13 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch13-20260823]
    paths:
      - '.github/workflows/apply-photo-batch13-once.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch13-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add six verified real-photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const before=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(before!==54) throw new Error(`expected 54 verified photos before batch 13, got ${before}`);
          const records={
            u000021:{university_id:'u000021',university_name:'大妻女子大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/5/50/Otsuma_Women%27s_University-1.JPG',source_url:'https://commons.wikimedia.org/wiki/File:Otsuma_Women%27s_University-1.JPG',source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。大妻女子大学千代田キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'大妻女子大学千代田キャンパス',reviewed_at:'2026-08-23'},
            u000040:{university_id:'u000040',university_name:'聖心女子大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/f/f0/University_of_the_Sacred_Heart.jpg',source_url:'https://commons.wikimedia.org/wiki/File:University_of_the_Sacred_Heart.jpg',source_label:'写真・ライセンス',creator:'Syced',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Syced、投稿者自身の作品、CC0 1.0による公開を確認。聖心女子大学の実景写真として、作者・原画像を追跡できる状態で掲載する。',alt:'聖心女子大学のキャンパス実景',reviewed_at:'2026-08-23'},
            u000041:{university_id:'u000041',university_name:'清泉女子大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/6/63/Seisen_University.jpg',source_url:'https://commons.wikimedia.org/wiki/File:Seisen_University.jpg',source_label:'写真・ライセンス',creator:'Hykw-a4',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで原投稿者Hykw-a4、CC BY-SA 3.0を確認。清泉女子大学の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'清泉女子大学のキャンパス実景',reviewed_at:'2026-08-23'},
            u000051:{university_id:'u000051',university_name:'東京医科大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/0/08/TokyoMedicalUniversityHospital_cropped.jpg',source_url:'https://commons.wikimedia.org/wiki/File:TokyoMedicalUniversityHospital_cropped.jpg',source_label:'写真・ライセンス',creator:'Hykw-a4 / 0607crp',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで原写真作者Hykw-a4、トリミング制作者0607crp、CC BY-SA 3.0を確認。東京医科大学病院の実景写真として、原写真・改変・ライセンスを追跡できる状態で掲載する。',alt:'東京医科大学病院の外観',reviewed_at:'2026-08-23'},
            u000067:{university_id:'u000067',university_name:'日本医科大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/b/b4/Nippon_Medical_School.JPG',source_url:'https://commons.wikimedia.org/wiki/File:Nippon_Medical_School.JPG',source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。日本医科大学医学部の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'日本医科大学医学部のキャンパス実景',reviewed_at:'2026-08-23'},
            u000076:{university_id:'u000076',university_name:'星薬科大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/3/30/Hoshi%CC%A0univ.jpg',source_url:'https://commons.wikimedia.org/wiki/File:Hoshi%CC%A0univ.jpg',source_label:'写真・ライセンス',creator:'Keramahani',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Keramahani、投稿者自身の作品、CC BY-SA 4.0を確認。星薬科大学本館の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'星薬科大学本館',reviewed_at:'2026-08-23'}
          };
          for(const [id,row] of Object.entries(records)){
            if(data.images[id]?.rights_status==='verified') throw new Error(`${id} already verified`);
            data.images[id]=row;
          }
          const after=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(after!==60) throw new Error(`expected 60 verified photos after batch 13, got ${after}`);
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`verified real university photos ${before} -> ${after}`);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'data: add verified Tokyo university photos batch 13'
          git push origin HEAD:feature/tokyo-real-photos-batch13-20260823
