name: University photo editor drag guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-editor-drag-guard.yml'

jobs:
  editor-drag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate clarity and drag source
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const root='tools/university-database/tokyo/photo-register/';
          const drag=fs.readFileSync(root+'editor-drag-pan.js','utf8');
          const css=fs.readFileSync(root+'community-submission-fixes.css','utf8');
          const stability=fs.readFileSync(root+'community-ui-stability.js','utf8');
          const loader=fs.readFileSync(root+'university-selection-sync-fix.js','utf8');
          assert.ok(drag.includes("canvas.addEventListener('pointerdown'")&&drag.includes('setPointerCapture'));
          assert.ok(drag.includes("event.target.closest?.('.edit-item')")&&drag.includes('openEditorFromRow'));
          assert.ok(drag.includes('__bantaiCommunityPhotoSubmission?.updateState'));
          assert.ok(css.includes('.simple-register-progress li')&&css.includes('border:0!important'));
          assert.ok(css.includes('.editor-pan-canvas')&&css.includes('cursor:grab'));
          assert.ok(stability.includes('communityUniversityChooser')&&stability.includes("left?'stable':'waiting-workspace'")&&stability.includes('select.disabled=false'));
          assert.ok(stability.includes('panel.appendChild(searchLabel)')&&stability.includes('panel.appendChild(selectLabel)'));
          assert.ok(loader.includes('community-submission-fixes.css?v=20260825-1142'));
          assert.ok(loader.includes('community-ui-stability.js?v=20260825-1142'));
          assert.ok(loader.includes('editor-drag-pan.js?v=20260825-1142'));
          console.log('progress clarity, chooser stability, editor opening and drag-pan source validated');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/photo-editor-drag.log 2>&1 &
          sleep 2
      - name: Verify stepper, edit state and drag movement
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNkYGD4z8DAwMDAxAADAAANHQEDasKb6QAAAABJRU5ErkJggg==','base64');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900},acceptDownloads:true});
            const url='http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/';
            await page.goto(url,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.documentElement.dataset.communityPhotoSubmission==='ready',{timeout:10000});
            await page.waitForFunction(()=>document.documentElement.dataset.editorDragPan==='ready',{timeout:10000});
            await page.waitForFunction(()=>document.documentElement.dataset.communityUniversityChooser==='stable',{timeout:10000});
            await page.waitForFunction(()=>document.querySelectorAll('#university-first-select option').length===145,{timeout:10000});
            await page.waitForTimeout(700);

            const current=page.locator('#simple-register-progress li.current');
            assert.equal(await current.count(),1,'one current progress step required');
            assert.equal(await current.evaluate(el=>getComputedStyle(el).borderTopWidth),'0px','progress step must not look like an input field');
            assert.equal(await page.locator('#university-first-select').isVisible(),true,'university select must be visibly operable');
            assert.equal(await page.locator('#university-first-select').isEnabled(),true,'university select must be enabled');
            assert.equal(await page.locator('#university-first-select').evaluate(el=>el.closest('#community-university-chooser')!==null),true,'public select must live in the stable chooser panel');

            await page.evaluate(()=>{
              const s=document.querySelector('#university-first-select');
              const snap=()=>{
                const r=s.getBoundingClientRect();
                const cs=getComputedStyle(s);
                const label=s.closest('label');
                const panel=s.closest('#community-university-chooser');
                return {t:Math.round(performance.now()),connected:s.isConnected,disabled:s.disabled,optionCount:s.options.length,hasTarget:!!s.querySelector('option[value="u000094"]'),value:s.value,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,width:Math.round(r.width),height:Math.round(r.height),labelHidden:!!label?.hidden,panelConnected:!!panel?.isConnected,parent:s.parentElement?.className||s.parentElement?.id||''};
              };
              window.__chooserTrace=[snap()];
              let last=JSON.stringify(window.__chooserTrace[0]);
              const record=()=>{const next=snap(),json=JSON.stringify(next);if(json!==last){window.__chooserTrace.push(next);last=json;}};
              new MutationObserver(record).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','disabled','style','class']});
              window.__chooserTimer=setInterval(record,100);
            });
            try{
              await page.locator('#university-first-select').selectOption('u000094',{timeout:7000});
            }catch(error){
              const diagnostics=await page.evaluate(()=>({trace:window.__chooserTrace,current:{html:document.querySelector('#university-first-select')?.outerHTML,parent:document.querySelector('#university-first-select')?.parentElement?.outerHTML?.slice(0,800),panel:document.querySelector('#community-university-chooser')?.outerHTML?.slice(0,1600)}}));
              console.error('CHOOSER_DIAGNOSTICS',JSON.stringify(diagnostics,null,2));
              throw error;
            }finally{
              await page.evaluate(()=>clearInterval(window.__chooserTimer));
            }

            await page.setInputFiles('#photo-input',{name:'drag-edit-test.png',mimeType:'image/png',buffer:png});
            await page.waitForFunction(()=>document.querySelectorAll('.batch-row').length===1,{timeout:10000});
            await page.waitForFunction(()=>document.querySelector('.main-photo-choice-card[data-main-type="new"]'),{timeout:10000});
            await page.locator('.main-photo-choice-card[data-main-type="new"]').click();
            for(const id of ['#community-rule-rights','#community-rule-no-ai','#community-rule-license'])await page.check(id);
            await page.waitForFunction(()=>!document.querySelector('#community-submit-package')?.disabled,{timeout:10000});

            await page.locator('.batch-row .edit-item').click();
            await page.waitForFunction(()=>!document.querySelector('#photo-editor')?.hidden,{timeout:10000});
            assert.equal(await page.locator('#photo-editor').isVisible(),true,'edit button must open editor directly');
            assert.equal(await page.locator('#community-submit-package').isDisabled(),false,'opening editor must not disable submission');
            assert.ok((await page.locator('#editor-drag-hint').innerText()).includes('ドラッグ'));

            await page.locator('#zoom').fill('110');
            await page.locator('#zoom').dispatchEvent('input');
            const beforeX=Number(await page.locator('#pos-x').inputValue());
            const beforeY=Number(await page.locator('#pos-y').inputValue());
            const box=await page.locator('#preview').boundingBox();
            assert.ok(box,'preview canvas required');
            const sx=box.x+box.width/2,sy=box.y+box.height/2;
            await page.mouse.move(sx,sy);
            await page.mouse.down();
            await page.mouse.move(sx+45,sy+32,{steps:5});
            await page.mouse.up();
            const afterX=Number(await page.locator('#pos-x').inputValue());
            const afterY=Number(await page.locator('#pos-y').inputValue());
            assert.notEqual(afterX,beforeX,'horizontal drag must update horizontal position');
            assert.notEqual(afterY,beforeY,'vertical drag must update vertical position');
            assert.equal(await page.locator('#community-submit-package').isDisabled(),false,'editing and drag must keep valid submission enabled');

            await page.setViewportSize({width:375,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'mobile must not overflow horizontally');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE