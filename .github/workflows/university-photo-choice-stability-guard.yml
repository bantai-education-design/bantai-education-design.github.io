name: University photo choice stability guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-choice-stability-guard.yml'

jobs:
  stable-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/photo-choice-stability.log 2>&1 &
          sleep 2
      - name: Verify university list and existing photo choice stay stable
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            page.on('pageerror',error=>console.log('[pageerror]',error.message));
            page.on('console',msg=>{if(['error','warning'].includes(msg.type()))console.log(`[console:${msg.type()}]`,msg.text());});
            page.on('response',response=>{
              if(/universities_tokyo_all\.generated\.json|university-entry-controller\.js/.test(response.url()))console.log('[response]',response.status(),response.url());
            });
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>({
              optionCount:document.querySelectorAll('#university-first-select option').length,
              optionText:document.querySelector('#university-first-select')?.innerText||'',
              status:document.querySelector('#university-first-status')?.textContent||'',
              controllerLoaded:[...document.scripts].some(s=>s.src.includes('university-entry-controller.js')),
              imeReady:document.documentElement.dataset.universityImeFix||'',
              uiSequence:document.documentElement.dataset.communityUiSequence||''
            }));
            console.log('[state]',JSON.stringify(state));
            await page.waitForFunction(()=>document.querySelectorAll('#university-first-select option').length===145,null,{timeout:10000});
            assert.equal(await page.locator('#university-first-select').isVisible(),true,'university select must be visible');
            assert.equal(await page.locator('#university-first-select').isEnabled(),true,'university select must be enabled');
            await page.locator('#university-first-select').selectOption('u000094');
            await page.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card').length>=2,null,{timeout:10000});
            const target=page.locator('.main-photo-choice-card').nth(1);
            await target.evaluate(el=>{el.dataset.stabilityProbe='keep';});
            const srcBefore=await target.locator('img').getAttribute('src');
            await target.click();
            const after=page.locator('.main-photo-choice-card').nth(1);
            assert.equal(await after.getAttribute('data-stability-probe'),'keep','selected existing photo card must not be replaced');
            assert.equal(await after.locator('img').getAttribute('src'),srcBefore,'selected existing photo image must remain mounted');
            assert.ok((await after.innerText()).includes('★ メイン'),'selected photo must become main');
            assert.equal(await page.locator('.main-photo-choice-card').count()>=2,true,'existing photo candidates must remain visible after selection');
            assert.equal(await page.locator('.main-photo-choice-card.active').count(),1,'exactly one main photo must remain selected');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Show local server requests
        if: always()
        run: cat /tmp/photo-choice-stability.log || true
