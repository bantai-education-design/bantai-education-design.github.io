name: University owner photo guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/data/user-photo-overrides.json'
      - 'tools/university-database/tokyo/assets/card-images/asia-university-bantai.jpg'
      - 'tools/university-database/tokyo/assets/card-images/rikkyo-university-bantai.jpg'
      - 'tools/university-database/tokyo/assets/ai-card-images.js'
      - 'tools/university-database/tokyo/assets/card-finish.js'
      - '.github/workflows/university-owner-photo-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/data/user-photo-overrides.json'
      - 'tools/university-database/tokyo/assets/card-images/asia-university-bantai.jpg'
      - 'tools/university-database/tokyo/assets/card-images/rikkyo-university-bantai.jpg'
      - 'tools/university-database/tokyo/assets/ai-card-images.js'
      - 'tools/university-database/tokyo/assets/card-finish.js'
      - '.github/workflows/university-owner-photo-guard.yml'

jobs:
  owner-photo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner-provided photo registry
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const data=JSON.parse(fs.readFileSync('tools/university-database/tokyo/data/user-photo-overrides.json','utf8'));
          assert.deepEqual(Object.keys(data.records||{}),['u000083','u000094']);
          const expected={
            u000083:{name:'立教大学',path:'assets/card-images/rikkyo-university-bantai.jpg',alt:'立教大学の蔦に覆われた校舎と時計・アーチ入口'},
            u000094:{name:'亜細亜大学',path:'assets/card-images/asia-university-bantai.jpg',alt:'亜細亜大学の校名表示とキャンパス入口'}
          };
          for(const [id,e] of Object.entries(expected)){
            const photo=data.records[id];
            assert.equal(photo.university_name,e.name,`${id}: name`);
            assert.equal(photo.rights_status,'verified',`${id}: verified`);
            assert.equal(photo.rights_basis,'photographer_permission',`${id}: rights basis`);
            assert.equal(photo.image_url,e.path,`${id}: image path`);
            assert.equal(photo.source_url,e.path,`${id}: source path`);
            assert.equal(photo.source_label,'撮影者提供',`${id}: source label`);
            assert.ok(photo.creator,`${id}: creator`);
            assert.ok(photo.license.includes('撮影者本人提供'),`${id}: license`);
            assert.ok(photo.rights_note.includes('撮影者本人'),`${id}: rights note`);
            assert.equal(photo.alt,e.alt,`${id}: alt`);
            assert.equal(photo.reviewed_at,'2026-08-23',`${id}: reviewed`);
            const image=fs.readFileSync(`tools/university-database/tokyo/${e.path}`);
            assert.ok(image.length>8000,`${id}: image size`);
            assert.equal(image[0],0xff,`${id}: JPEG SOI 1`);
            assert.equal(image[1],0xd8,`${id}: JPEG SOI 2`);
          }
          const asia=fs.readFileSync('tools/university-database/tokyo/assets/card-images/asia-university-bantai.jpg');
          assert.equal(asia.at(-2),0xff,'Asia JPEG EOI 1');
          assert.equal(asia.at(-1),0xd9,'Asia JPEG EOI 2');
          console.log('owner-provided university photo registry validated');
          NODE
          test "$(git hash-object tools/university-database/tokyo/assets/card-images/asia-university-bantai.jpg)" = "b1ccf41052fca70e98fd17fcb0506c5d8b58bd16"
          test "$(git hash-object tools/university-database/tokyo/assets/card-images/rikkyo-university-bantai.jpg)" = "6d216fe928af0d578f1d73f1e255d77c3591ada5"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/university-owner-photo-site.log 2>&1 &
          sleep 2
      - name: Verify owner-provided university photos in browser
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:950}});
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,{timeout:15000});
            await page.waitForFunction(()=>document.documentElement.dataset.userPhotoOverlay==='ready',{timeout:10000});
            const expected={
              u000083:{path:'assets/card-images/rikkyo-university-bantai.jpg',alt:'立教大学の蔦に覆われた校舎と時計・アーチ入口',width:360,height:203},
              u000094:{path:'assets/card-images/asia-university-bantai.jpg',alt:'亜細亜大学の校名表示とキャンパス入口'}
            };
            for(const [id,e] of Object.entries(expected)){
              const card=page.locator(`.tokyo-card[data-id="${id}"]`);
              assert.equal(await card.count(),1,`${id}: card`);
              const visual=card.locator('.real-university-image');
              assert.equal(await visual.count(),1,`${id}: real photo visual`);
              const img=visual.locator('img.university-card-image');
              assert.equal(await img.getAttribute('src'),e.path,`${id}: relative path`);
              assert.equal(await img.getAttribute('alt'),e.alt,`${id}: alt`);
              await page.waitForFunction(id=>{const el=document.querySelector(`.tokyo-card[data-id="${id}"] img.university-card-image`);return !!el&&el.complete&&el.naturalWidth>0&&el.naturalHeight>0;},id,{timeout:10000});
              const dims=await img.evaluate(el=>({w:el.naturalWidth,h:el.naturalHeight,complete:el.complete}));
              assert.equal(dims.complete,true,`${id}: image complete`);
              assert.ok(dims.w>0&&dims.h>0,`${id}: image decoded`);
              if(e.width){assert.equal(dims.w,e.width,`${id}: width`);assert.equal(dims.h,e.height,`${id}: height`);}
              const source=visual.locator('.image-source-link');
              assert.equal(await source.count(),1,`${id}: source`);
              assert.ok((await source.innerText()).includes('撮影者提供'),`${id}: owner label`);
              assert.equal(await source.getAttribute('href'),e.path,`${id}: owner href`);
            }
            assert.equal(await page.locator('.real-university-image').count(),54,'Verified real-photo total stays 54');
            const rikkyo=page.locator('.tokyo-card[data-id="u000083"]');
            await rikkyo.scrollIntoViewIfNeeded();
            await rikkyo.screenshot({path:'rikkyo-owner-card.png'});
            await page.setViewportSize({width:375,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,'No mobile horizontal overflow');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rikkyo-owner-card-preview
          path: rikkyo-owner-card.png
          if-no-files-found: ignore
