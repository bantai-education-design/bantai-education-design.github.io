name: Apply remaining university Commons photo batch

on:
  push:
    branches:
      - feature/complete-remaining-university-photos-20260904
    paths:
      - 'tools/university-database/tokyo/data/university-images-commons-batch-remaining-20260904.json'
      - '.github/workflows/apply-university-commons-remaining.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-remaining-university-photos-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge remaining verified records into canonical registry
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const batchPath='tools/university-database/tokyo/data/university-images-commons-batch-remaining-20260904.json';
          const base=JSON.parse(fs.readFileSync(path,'utf8'));
          const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
          const records=batch.records||{};
          const ids=Object.keys(records);
          if(ids.length!==9)throw new Error(`expected 9 approved records, got ${ids.length}`);
          for(const [id,row] of Object.entries(records)){
            if(row.university_id!==id)throw new Error(`${id}: university_id mismatch`);
            if(row.rights_status!=='verified')throw new Error(`${id}: not verified`);
            for(const key of ['university_name','image_url','source_url','source_label','creator','license','license_url','rights_note','alt','reviewed_at']){
              if(!row[key])throw new Error(`${id}: missing ${key}`);
            }
            if(!row.image_url.startsWith('https://upload.wikimedia.org/'))throw new Error(`${id}: image URL is not Wikimedia`);
            if(!row.source_url.startsWith('https://commons.wikimedia.org/wiki/File:'))throw new Error(`${id}: source is not Commons file page`);
            if(!/^(CC0|CC BY|Public domain)/i.test(row.license))throw new Error(`${id}: unsupported license ${row.license}`);
          }
          base.images=base.images||{};
          for(const [id,row] of Object.entries(records))base.images[id]=row;
          base.policy=base.policy||{};
          base.policy.visual_strategy='実景写真を優先する。Wikimedia Commons等の再利用条件が明確な第三者写真を広く収集し、作者・ライセンス・原ページを記録したうえで掲載する。本人提供写真は別台帳で最優先上書きする。';
          fs.writeFileSync(path,JSON.stringify(base,null,2)+'\n');
          const verified=Object.values(base.images).filter(x=>x?.rights_status==='verified').length;
          if(verified!==143)throw new Error(`expected verified real-photo coverage 143/144, got ${verified}`);
          if(base.images.u000123?.rights_status==='verified')throw new Error('LEC must remain unresolved until current-site photo is verified');
          console.log(`merged=${ids.length} verified_real=${verified}`);
          NODE
      - name: Commit canonical registry
        run: |
          if git diff --quiet -- tools/university-database/tokyo/data/university-images.json; then
            echo 'Canonical registry already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git commit -m 'data: publish remaining verified Commons university photos'
          git push origin HEAD:feature/complete-remaining-university-photos-20260904
