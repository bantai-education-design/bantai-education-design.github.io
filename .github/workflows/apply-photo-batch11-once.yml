name: Apply Tokyo photo batch 11 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch11-20260823]
    paths:
      - '.github/workflows/apply-photo-batch11-once.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch11-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add six verified real-photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const before=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(before!==42) throw new Error(`expected 42 verified photos before batch 11, got ${before}`);
          const records={
            u000037:{
              university_id:'u000037',university_name:'女子美術大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/4/4b/Joshibi_University_of_Art_and_Design-1.JPG',
              source_url:'https://commons.wikimedia.org/wiki/File:Joshibi_University_of_Art_and_Design-1.JPG',
              source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。女子美術大学の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'女子美術大学のキャンパス実景',reviewed_at:'2026-08-23'
            },
            u000045:{
              university_id:'u000045',university_name:'大東文化大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/5/55/Daito_bunka_univ_Itabashi_campus1.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Daito_bunka_univ_Itabashi_campus1.jpg',
              source_label:'写真・ライセンス',creator:'Monthneed',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Monthneed、投稿者自身の作品、CC BY-SA 3.0を確認。大東文化大学板橋キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'大東文化大学板橋キャンパス',reviewed_at:'2026-08-23'
            },
            u000047:{
              university_id:'u000047',university_name:'拓殖大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/d/dc/TakushokuUnivMainBuilding.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:TakushokuUnivMainBuilding.jpg',
              source_label:'写真・ライセンス',creator:'Sinpost',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで原投稿者Sinpost、CC BY-SA 3.0を確認。拓殖大学文京キャンパスA館（本館）の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'拓殖大学文京キャンパスA館（本館）',reviewed_at:'2026-08-23'
            },
            u000050:{
              university_id:'u000050',university_name:'東海大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/c/c9/Tokai_University_Shinagawa_%28Takanawa%29_campus_entrance.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Tokai_University_Shinagawa_(Takanawa)_campus_entrance.jpg',
              source_label:'写真・ライセンス',creator:'葵心',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者「葵心」、投稿者自身の作品、CC BY-SA 4.0を確認。東海大学品川キャンパス入口の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'東海大学品川キャンパスの入口',reviewed_at:'2026-08-23'
            },
            u000094:{
              university_id:'u000094',university_name:'亜細亜大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/f/f2/Asia_University%2C_Hinode_Campus.JPG',
              source_url:'https://commons.wikimedia.org/wiki/File:Asia_University,_Hinode_Campus.JPG',
              source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。亜細亜大学日の出キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'亜細亜大学日の出キャンパス',reviewed_at:'2026-08-23'
            },
            u000102:{
              university_id:'u000102',university_name:'帝京大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/0/02/Teikyo_University_Itabashi_Campus_Main_Building.JPG',
              source_url:'https://commons.wikimedia.org/wiki/File:Teikyo_University_Itabashi_Campus_Main_Building.JPG',
              source_label:'写真・ライセンス',creator:'ペン太',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者「ペン太」、投稿者自身の作品、CC BY-SA 4.0を確認。帝京大学板橋キャンパス大学棟本館の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'帝京大学板橋キャンパス大学棟本館',reviewed_at:'2026-08-23'
            }
          };
          for(const [id,row] of Object.entries(records)){
            if(data.images[id]?.rights_status==='verified') throw new Error(`${id} already verified`);
            data.images[id]=row;
          }
          const after=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(after!==48) throw new Error(`expected 48 verified photos after batch 11, got ${after}`);
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`verified real university photos ${before} -> ${after}`);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'data: add verified Tokyo university photos batch 11'
          git push origin HEAD:feature/tokyo-real-photos-batch11-20260823
