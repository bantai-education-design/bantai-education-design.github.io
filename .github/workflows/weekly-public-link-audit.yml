name: Weekly public link audit

on:
  schedule:
    # Tuesday 08:00 JST, separate from Monday health audit
    - cron: '0 23 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_public_links.py'
      - 'scripts/test_public_links.py'
      - '.github/workflows/weekly-public-link-audit.yml'

permissions:
  contents: read

jobs:
  public-link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests (no network)
        run: python -m unittest discover -s scripts -p 'test_public_links.py' -v
      - name: Sample live public sitemap links
        run: python scripts/check_public_links.py --limit 12 --timeout 8
