name: Install verified database hero
on:
  push:
    branches:
      - feature/databases-gateway-image-v2
    paths:
      - '.github/workflows/install-database-hero.yml'

permissions:
  contents: write

jobs:
  install-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/databases-gateway-image-v2
      - name: Fetch verified binary from Adobe and validate
        env:
          HERO_URL: https://at.adobe.com/UtavUL40OcDQGYpI
          EXPECTED_SHA256: b39c985faf0b96234cbe742afe301ba1e06de692d1a5761ddff251eae2cbc894
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl -L --fail --retry 3 --retry-delay 2 "$HERO_URL" -o assets/images/databases-gateway-hero.jpg
          echo "$EXPECTED_SHA256  assets/images/databases-gateway-hero.jpg" | sha256sum -c -
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          p='assets/images/databases-gateway-hero.jpg'
          with Image.open(p) as im:
              assert im.format == 'JPEG', im.format
              assert im.size == (1536, 503), im.size
              im.verify()
          print('verified JPEG 1536x503')
          PY
      - name: Commit verified hero to source branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/databases-gateway-hero.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'assets: install verified database gateway hero'
          git push origin HEAD:feature/databases-gateway-image-v2
