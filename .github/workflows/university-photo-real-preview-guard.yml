name: University photo real preview guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'tools/university-database/tokyo/detail.html'
      - 'tools/university-database/tokyo/assets/detail.css'
      - 'tools/university-database/tokyo/assets/detail-photo-preview.js'
      - '.github/workflows/university-photo-real-preview-guard.yml'

jobs:
  real-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/university-photo-preview.log 2>&1 &
          sleep 2
      - name: Verify main choice, independent editor scroll and real preview
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNkYGD4z8DAwMDAxAADAAANHQEDasKb6QAAAABJRU5ErkJggg==','base64');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1366,height:900}});

            const choicePage=await ctx.newPage();
            await choicePage.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await choicePage.waitForSelector('#registration-mode-switch');
            await choicePage.locator('#university-first-select').selectOption('u000094');
            await choicePage.waitForSelector('#existing-photo-choice:not([hidden])',{timeout:10000});
            assert.equal(await choicePage.locator('.university-first > #existing-photo-choice').count(),1,'photo picker must appear directly in university selection panel');
            assert.ok((await choicePage.locator('#existing-photo-choice').innerText()).includes('亜細亜大学'),'selected university name must be shown in photo picker');
            const existing=choicePage.locator('.main-photo-choice-card').first();
            assert.equal(await existing.evaluate(el=>el.classList.contains('active')),true,'existing owner photo should start as main immediately after university selection');
            assert.ok((await existing.innerText()).includes('★ メイン'),'existing main role must be visible before adding a new photo');

            await choicePage.setInputFiles('#photo-input',{name:'asia-new.png',mimeType:'image/png',buffer:png});
            await choicePage.waitForFunction(()=>document.querySelectorAll('.batch-row').length===1,{timeout:10000});
            await choicePage.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card').length>=2,{timeout:10000});
            const cards=choicePage.locator('.main-photo-choice-card');
            assert.ok((await cards.nth(1).innerText()).includes('サブ'),'new photo must initially show its sub role while existing photo remains main');
            await cards.nth(1).click();
            assert.equal(await cards.nth(1).evaluate(el=>el.classList.contains('active')),true,'new photo can become main by clicking photo');
            assert.ok((await cards.nth(1).innerText()).includes('★ メイン'),'clicked new photo must visibly become main');
            assert.equal(await cards.nth(0).evaluate(el=>el.classList.contains('active')),false,'existing photo must no longer be main');
            assert.ok((await cards.nth(0).innerText()).includes('サブ'),'previous main must visibly become sub');
            await cards.nth(0).click();
            assert.equal(await cards.nth(0).evaluate(el=>el.classList.contains('active')),true,'existing photo can be selected again');
            assert.equal(await cards.nth(1).evaluate(el=>el.classList.contains('active')),false,'only one main photo may be selected');

            await choicePage.locator('#photo-editor').scrollIntoViewIfNeeded();
            const editorLayout=await choicePage.evaluate(()=>({
              controlsOverflow:getComputedStyle(document.querySelector('.edit-grid>.controls')).overflowY,
              controlsPosition:getComputedStyle(document.querySelector('.edit-grid>.controls')).position,
              previewPosition:getComputedStyle(document.querySelector('.preview-panel')).position,
              gridOverflow:getComputedStyle(document.querySelector('.edit-grid')).overflow
            }));
            assert.equal(editorLayout.controlsOverflow,'auto','editor controls must scroll independently');
            assert.equal(editorLayout.controlsPosition,'sticky','controls panel itself must stay in place');
            assert.equal(editorLayout.previewPosition,'sticky','preview panel must stay fixed in place');
            assert.equal(editorLayout.gridOverflow,'visible','parent must not trap sticky positioning');
            const before=await choicePage.evaluate(()=>({
              previewTop:document.querySelector('.preview-panel').getBoundingClientRect().top,
              controlsTop:document.querySelector('.edit-grid>.controls').getBoundingClientRect().top
            }));
            await choicePage.evaluate(()=>{const el=document.querySelector('.edit-grid>.controls');el.scrollTop=Math.min(220,el.scrollHeight-el.clientHeight);});
            await choicePage.waitForTimeout(100);
            const after=await choicePage.evaluate(()=>({
              previewTop:document.querySelector('.preview-panel').getBoundingClientRect().top,
              controlsTop:document.querySelector('.edit-grid>.controls').getBoundingClientRect().top,
              controlsScroll:document.querySelector('.edit-grid>.controls').scrollTop
            }));
            assert.ok(Math.abs(after.previewTop-before.previewTop)<=1,'preview must not move when left controls scroll');
            assert.ok(Math.abs(after.controlsTop-before.controlsTop)<=1,'controls panel frame must not move while its contents scroll');
            assert.ok(after.controlsScroll>=0,'controls must accept independent scrolling');
            await choicePage.close();

            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await page.waitForSelector('#registration-mode-switch');
            await page.locator('#university-first-select').selectOption('u000083');
            await page.setInputFiles('#photo-input',[
              {name:'rikkyo-a.png',mimeType:'image/png',buffer:png},
              {name:'rikkyo-b.png',mimeType:'image/png',buffer:png},
              {name:'rikkyo-c.png',mimeType:'image/png',buffer:png}
            ]);
            await page.waitForFunction(()=>document.querySelectorAll('.batch-row').length===3,{timeout:10000});

            const popupPromise=ctx.waitForEvent('page');
            await page.locator('#open-real-preview').click();
            const preview=await popupPromise;
            await preview.waitForURL(/detail\.html\?id=u000083&photo_preview_token=/,{timeout:15000});
            await preview.waitForLoadState('domcontentloaded');
            await preview.waitForFunction(()=>{
              const hero=document.querySelector('.detail-hero.photo-preview-active');
              return !!hero?.querySelector('.detail-photo-preview-gallery')&&hero.querySelectorAll('.detail-photo-preview-thumb').length===3;
            },{timeout:15000});
            const layout=await preview.evaluate(()=>{
              const hero=document.querySelector('.detail-hero.photo-preview-active');
              const gallery=hero?.querySelector('.detail-photo-preview-gallery');
              const thumb=hero?.querySelector('.detail-photo-preview-thumb');
              const thumbs=hero?.querySelector('.detail-photo-preview-thumbs');
              if(!hero||!gallery||!thumb||!thumbs)return null;
              return {
                position:getComputedStyle(gallery).position,
                controlsZ:Number(getComputedStyle(thumbs).zIndex)||0,
                heroHeight:Math.round(hero.getBoundingClientRect().height),
                galleryHeight:Math.round(gallery.getBoundingClientRect().height),
                thumbWidth:Math.round(thumb.getBoundingClientRect().width)
              };
            });
            assert.ok(layout,'stable real-page gallery layout required');
            assert.equal(layout.position,'absolute','gallery must be a background layer, not extra vertical content');
            assert.equal(layout.galleryHeight,layout.heroHeight,'background must fill the existing hero without adding a section');
            assert.ok(layout.controlsZ>=2,'thumbnail controls must sit above university information panels');
            assert.ok(layout.thumbWidth<=70,`thumbnail too large: ${layout.thumbWidth}`);
            await preview.locator('.detail-photo-preview-thumb').nth(2).click();
            assert.equal(await preview.locator('.detail-photo-preview-thumb.active').count(),1);

            await preview.setViewportSize({width:375,height:900});
            await preview.waitForFunction(()=>!!document.querySelector('.detail-hero.photo-preview-active .detail-photo-preview-gallery'));
            assert.equal(await preview.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'preview must not create mobile horizontal overflow');
            const mobileThumb=await preview.evaluate(()=>Math.round(document.querySelector('.detail-photo-preview-thumb')?.getBoundingClientRect().width||0));
            assert.ok(mobileThumb>0&&mobileThumb<=52,`mobile thumbnail too large or missing: ${mobileThumb}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
