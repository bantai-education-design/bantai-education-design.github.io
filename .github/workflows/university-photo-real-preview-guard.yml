name: University photo real preview guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'tools/university-database/tokyo/detail.html'
      - 'tools/university-database/tokyo/assets/detail.css'
      - 'tools/university-database/tokyo/assets/detail-photo-preview.js'
      - 'tools/university-database/tokyo/assets/detail-photo-emphasis.css'
      - 'tools/university-database/tokyo/assets/detail-stat-readability.js'
      - '.github/workflows/university-photo-real-preview-guard.yml'

jobs:
  real-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/university-photo-preview.log 2>&1 &
          sleep 2
      - name: Verify all existing photos, roles, fixed editor and real preview
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNkYGD4z8DAwMDAxAADAAANHQEDasKb6QAAAABJRU5ErkJggg==','base64');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1366,height:900}});

            const choicePage=await ctx.newPage();
            await choicePage.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await choicePage.waitForSelector('#registration-mode-switch',{state:'attached'});
            await choicePage.locator('#university-first-select').selectOption('u000094');
            await choicePage.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card').length>=2,{timeout:10000});
            assert.equal(await choicePage.locator('.university-first > #existing-photo-choice').count(),1,'photo picker must appear directly in university selection panel');
            const beforeAdd=choicePage.locator('.main-photo-choice-card');
            assert.ok(await beforeAdd.count()>=2,'Asia University must show both owner photo and prior public registry photo before adding a new photo');
            const pickerText=await choicePage.locator('#existing-photo-choice').innerText();
            assert.ok(pickerText.includes('撮影者提供・現在登録済み'),'owner photo source must be visible');
            assert.ok(pickerText.includes('従来の公開画像台帳'),'prior public registry photo must be visible');
            assert.ok((await beforeAdd.nth(0).innerText()).includes('★ メイン'),'owner override should start as main');
            assert.ok((await beforeAdd.nth(1).innerText()).includes('サブ'),'prior public image should start as sub');

            await choicePage.setInputFiles('#photo-input',{name:'asia-new.png',mimeType:'image/png',buffer:png});
            await choicePage.waitForFunction(()=>document.querySelectorAll('.batch-row').length===1,{timeout:10000});
            await choicePage.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card').length>=3,{timeout:10000});
            let cards=choicePage.locator('.main-photo-choice-card');
            const newIndex=(await cards.count())-1;
            assert.ok((await cards.nth(newIndex).innerText()).includes('サブ'),'new photo must initially be sub');
            await cards.nth(newIndex).click();
            cards=choicePage.locator('.main-photo-choice-card');
            assert.ok((await cards.nth(newIndex).innerText()).includes('★ メイン'),'clicked new photo must become main');
            assert.ok((await cards.nth(0).innerText()).includes('サブ'),'previous owner main must become sub');
            await cards.nth(1).click();
            cards=choicePage.locator('.main-photo-choice-card');
            assert.ok((await cards.nth(1).innerText()).includes('★ メイン'),'prior public registry photo must also be selectable as main');
            assert.equal(await choicePage.locator('.main-photo-choice-card.active').count(),1,'exactly one main photo is allowed');

            await choicePage.locator('#photo-editor').scrollIntoViewIfNeeded();
            const editorLayout=await choicePage.evaluate(()=>({
              controlsOverflow:getComputedStyle(document.querySelector('.edit-grid>.controls')).overflowY,
              controlsPosition:getComputedStyle(document.querySelector('.edit-grid>.controls')).position,
              previewPosition:getComputedStyle(document.querySelector('.preview-panel')).position,
              gridOverflow:getComputedStyle(document.querySelector('.edit-grid')).overflow
            }));
            assert.equal(editorLayout.controlsOverflow,'auto');
            assert.equal(editorLayout.controlsPosition,'sticky');
            assert.equal(editorLayout.previewPosition,'sticky');
            assert.equal(editorLayout.gridOverflow,'visible');
            const before=await choicePage.evaluate(()=>({previewTop:document.querySelector('.preview-panel').getBoundingClientRect().top,controlsTop:document.querySelector('.edit-grid>.controls').getBoundingClientRect().top}));
            await choicePage.evaluate(()=>{const el=document.querySelector('.edit-grid>.controls');el.scrollTop=Math.min(220,el.scrollHeight-el.clientHeight);});
            await choicePage.waitForTimeout(100);
            const after=await choicePage.evaluate(()=>({previewTop:document.querySelector('.preview-panel').getBoundingClientRect().top,controlsTop:document.querySelector('.edit-grid>.controls').getBoundingClientRect().top}));
            assert.ok(Math.abs(after.previewTop-before.previewTop)<=1,'preview must not move when left controls scroll');
            assert.ok(Math.abs(after.controlsTop-before.controlsTop)<=1,'controls frame must not move');
            await choicePage.close();

            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await page.waitForSelector('#registration-mode-switch',{state:'attached'});
            await page.locator('#university-first-select').selectOption('u000083');
            await page.setInputFiles('#photo-input',[
              {name:'rikkyo-a.png',mimeType:'image/png',buffer:png},
              {name:'rikkyo-b.png',mimeType:'image/png',buffer:png},
              {name:'rikkyo-c.png',mimeType:'image/png',buffer:png}
            ]);
            await page.waitForFunction(()=>document.querySelectorAll('.batch-row').length===3,{timeout:10000});
            const expectedThumbs=Math.min(5,await page.locator('.main-photo-choice-card').count());
            const popupPromise=ctx.waitForEvent('page');
            await page.locator('#open-real-preview').click();
            const preview=await popupPromise;
            await preview.waitForURL(/detail\.html\?id=u000083&photo_preview_token=/,{timeout:15000});
            await preview.waitForLoadState('domcontentloaded');
            await preview.waitForFunction(expected=>{
              const hero=document.querySelector('.detail-hero.photo-preview-active');
              return !!hero?.querySelector('.detail-photo-preview-gallery')&&hero.querySelectorAll('.detail-photo-preview-thumb').length===expected;
            },expectedThumbs,{timeout:15000});
            await preview.waitForFunction(()=>[...document.querySelectorAll('.detail-stat small')].some(x=>x.textContent.trim()==='学部数'),{timeout:15000});
            const layout=await preview.evaluate(()=>{
              const hero=document.querySelector('.detail-hero.photo-preview-active');
              const gallery=hero?.querySelector('.detail-photo-preview-gallery');
              const thumb=hero?.querySelector('.detail-photo-preview-thumb');
              const thumbs=hero?.querySelector('.detail-photo-preview-thumbs');
              const side=hero?.querySelector('.detail-hero-side');
              const faculty=[...hero?.querySelectorAll('.detail-stat')||[]].find(x=>x.querySelector('small')?.textContent.trim()==='学部数');
              const facultyLabel=faculty?.querySelector('small');
              const facultyValue=faculty?.querySelector('strong');
              if(!hero||!gallery||!thumb||!thumbs||!side||!facultyLabel||!facultyValue)return null;
              return {
                position:getComputedStyle(gallery).position,
                controlsZ:Number(getComputedStyle(thumbs).zIndex)||0,
                heroHeight:Math.round(hero.getBoundingClientRect().height),
                sideHeight:Math.round(side.getBoundingClientRect().height),
                galleryHeight:Math.round(gallery.getBoundingClientRect().height),
                thumbWidth:Math.round(thumb.getBoundingClientRect().width),
                facultyValue:facultyValue.textContent.trim(),
                facultyLabelColor:getComputedStyle(facultyLabel).color
              };
            });
            assert.ok(layout);
            assert.equal(layout.position,'absolute');
            assert.equal(layout.galleryHeight,layout.heroHeight);
            assert.ok(layout.controlsZ>=2);
            assert.ok(layout.thumbWidth>=90&&layout.thumbWidth<=104,'desktop photo thumbnails must be large enough to inspect');
            assert.ok(layout.sideHeight<layout.heroHeight-40,'stat panel must not occupy the full photo hero height');
            assert.match(layout.facultyValue,/^(?:\d[\d,]*学部|更新中|該当なし)$/,'faculty count must explain its unit');
            assert.notEqual(layout.facultyLabelColor,'rgb(232, 238, 244)','stat label must not be pale text on a light card');
            await preview.locator('.detail-photo-preview-thumb').last().click();
            assert.equal(await preview.locator('.detail-photo-preview-thumb.active').count(),1);
            await preview.setViewportSize({width:375,height:900});
            await preview.waitForTimeout(100);
            const mobileThumbWidth=await preview.locator('.detail-photo-preview-thumb').first().evaluate(el=>Math.round(el.getBoundingClientRect().width));
            assert.ok(mobileThumbWidth>=68,'mobile thumbnails must remain visibly selectable');
            assert.equal(await preview.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
