name: Database entry visual guard
on:
  pull_request:
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'
  push:
    branches: [main]
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'

jobs:
  visual-entry-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify navigation and capture screenshots
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const pages = [
              ['databases','/databases/'],
              ['university-portal','/tools/university-database/'],
              ['tokyo','/tools/university-database/tokyo/']
            ];
            for (const [name,path] of pages) {
              for (const [suffix,width,height] of [['pc',1366,900],['mobile',375,900]]) {
                const page = await browser.newPage({viewport:{width,height}});
                await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth <= window.innerWidth + 1), true, `${name}-${suffix}: horizontal overflow`);
                await page.screenshot({path:`visual-preview/${name}-${suffix}.png`,fullPage:false});
                await page.close();
              }
            }
            const hub = await browser.newPage({viewport:{width:1366,height:900}});
            await hub.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            const gateway = hub.locator('.db-gateway');
            await gateway.waitFor({state:'visible'});
            assert.equal(await hub.locator('#database-gateway-art').count(),0,'obsolete raster gateway artwork remains');
            assert.equal(await hub.locator('.db-service').count(),4,'database service cards should be 4');
            for (const card of await hub.locator('.db-service').all()) {
              const box = await card.boundingBox();
              assert.ok(box && box.width > 180 && box.height > 120, 'database service card has no usable area');
            }
            const expected = [
              ['学校情報','/tools/school-database/'],
              ['地域・統計データ','/tools/school-database/analytics/'],
              ['教科書・年間指導計画','/resources/textbook-plans/'],
              ['全国大学データベース','/tools/university-database/']
            ];
            for (const [heading,href] of expected) {
              const card = hub.locator('.db-service').filter({hasText:heading}).first();
              assert.ok(await card.count() >= 1, `${heading}: missing`);
              assert.equal(await card.getAttribute('href'), href, `${heading}: wrong href`);
            }
            const hubText=await hub.locator('body').innerText();
            assert.equal(hubText.includes('東京144大学'),false,'obsolete Tokyo-only wording remains');
            await gateway.screenshot({path:'visual-preview/databases-gateway-pc.png'});
            await hub.close();

            const tokyo = await browser.newPage({viewport:{width:1366,height:900}});
            await tokyo.goto('http://127.0.0.1:4173/tools/university-database/tokyo/?packs=0',{waitUntil:'networkidle'});
            await tokyo.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length>=144,{timeout:25000});
            const topButton=tokyo.locator('button[aria-label="ページ上部へ戻る"]').first();
            await topButton.waitFor({state:'attached'});
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'hidden','top button should start hidden');
            await tokyo.evaluate(()=>window.scrollTo(0,Math.max(900,document.documentElement.scrollHeight*0.45)));
            await tokyo.waitForTimeout(300);
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'visible','top button should appear after scrolling');
            const before=await tokyo.evaluate(()=>window.scrollY);
            assert.ok(before>520,'test page should be scrolled');
            await topButton.click();
            await tokyo.waitForFunction(()=>window.scrollY<80,null,{timeout:3000});
            const text = await tokyo.locator('body').innerText();
            assert.equal(text.includes('公開準備中'), false, 'Tokyo page still contains pre-release wording');
            assert.equal(text.includes('209'), true, 'Unified university page should show 209 universities');
            await tokyo.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-entry-visual-preview
          path: visual-preview/*.png
