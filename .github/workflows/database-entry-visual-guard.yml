name: Database entry visual guard
on:
  pull_request:
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'
  push:
    branches: [main]
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'

jobs:
  visual-entry-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify navigation and capture screenshots
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const pages = [
              ['databases','/databases/'],
              ['university-portal','/tools/university-database/'],
              ['tokyo','/tools/university-database/tokyo/']
            ];
            for (const [name,path] of pages) {
              for (const [suffix,width,height] of [['pc',1366,900],['mobile',375,900]]) {
                const page = await browser.newPage({viewport:{width,height}});
                await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth <= window.innerWidth + 1), true, `${name}-${suffix}: horizontal overflow`);
                await page.screenshot({path:`visual-preview/${name}-${suffix}.png`,fullPage:false});
                await page.close();
              }
            }
            const hub = await browser.newPage({viewport:{width:1366,height:900}});
            await hub.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            const art = hub.locator('#database-gateway-art');
            await art.waitFor({state:'attached'});
            assert.equal(await art.getAttribute('src'), '/assets/images/databases-gateway-hero.jpg', 'gateway artwork should use the official hero asset path');
            const imageState = await art.evaluate(img=>({complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}));
            assert.equal(imageState.complete,true,'gateway artwork did not finish loading');
            assert.equal(imageState.naturalWidth,1536,`gateway artwork width invalid: ${imageState.naturalWidth}`);
            assert.equal(imageState.naturalHeight,503,`gateway artwork height invalid: ${imageState.naturalHeight}`);
            assert.equal(await hub.locator('.db-hotspot').count(),6,'gateway artwork should have six interactive hotspots');
            const artBox = await art.boundingBox();
            assert.ok(artBox && artBox.width > 1000 && artBox.height > 300, 'gateway artwork render box is too small');
            for (const hotspot of await hub.locator('.db-hotspot').all()) {
              const box = await hotspot.boundingBox();
              assert.ok(box && box.width > 8 && box.height > 8, 'gateway hotspot has no usable area');
              assert.ok(box.x >= artBox.x - 1 && box.y >= artBox.y - 1, 'gateway hotspot starts outside artwork');
              assert.ok(box.x + box.width <= artBox.x + artBox.width + 1, 'gateway hotspot extends beyond artwork width');
              assert.ok(box.y + box.height <= artBox.y + artBox.height + 1, 'gateway hotspot extends beyond artwork height');
              const center = {x:box.x + box.width/2, y:box.y + box.height/2};
              const hit = await hub.evaluate(({x,y})=>{
                const el=document.elementFromPoint(x,y);
                return !!el?.classList?.contains('db-hotspot');
              }, center);
              assert.equal(hit,true,'gateway hotspot center is not clickable');
            }
            const expected = [
              ['学校を探す','/tools/school-database/'],
              ['学びの流れを見る','/resources/textbook-plans/'],
              ['未来の学びを探す','/tools/university-database/']
            ];
            for (const [heading,href] of expected) {
              const card = hub.locator('.db-card').filter({hasText:heading}).first();
              assert.ok(await card.count() >= 1, `${heading}: missing`);
              assert.equal(await card.getAttribute('href'), href, `${heading}: wrong href`);
            }
            assert.equal(await hub.locator('.db-card').count(),3,'fallback database cards should be 3');
            await hub.addStyleTag({content:'.db-hotspot{outline:3px solid #ff2d55!important;background:rgba(255,45,85,.08)!important;box-shadow:none!important}'});
            await hub.locator('.db-artboard').screenshot({path:'visual-preview/databases-hotspots-pc.png'});
            await hub.close();

            const tokyo = await browser.newPage({viewport:{width:1366,height:900}});
            await tokyo.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await tokyo.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,{timeout:15000});
            const topButton=tokyo.locator('button[aria-label="ページ上部へ戻る"]').first();
            await topButton.waitFor({state:'attached'});
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'hidden','top button should start hidden');
            await tokyo.evaluate(()=>window.scrollTo(0,Math.max(900,document.documentElement.scrollHeight*0.45)));
            await tokyo.waitForTimeout(300);
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'visible','top button should appear after scrolling');
            const before=await tokyo.evaluate(()=>window.scrollY);
            assert.ok(before>520,'test page should be scrolled');
            await topButton.click();
            await tokyo.waitForFunction(()=>window.scrollY<80,null,{timeout:3000});
            const text = await tokyo.locator('body').innerText();
            assert.equal(text.includes('公開準備中'), false, 'Tokyo page still contains pre-release wording');
            assert.equal(text.includes('144'), true, 'Tokyo page should show 144 universities');
            await tokyo.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-entry-visual-preview
          path: visual-preview/*.png