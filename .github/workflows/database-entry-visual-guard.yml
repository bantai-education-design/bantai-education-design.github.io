name: Database entry visual guard
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visual-entry-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
      - run: |
          mkdir -p visual-preview
          npx playwright screenshot --viewport-size="1366,900" http://127.0.0.1:4173/databases/ visual-preview/databases-pc.png
          npx playwright screenshot --viewport-size="375,900" http://127.0.0.1:4173/databases/ visual-preview/databases-mobile.png
          npx playwright screenshot --viewport-size="1366,900" http://127.0.0.1:4173/tools/university-database/ visual-preview/university-portal-pc.png
          npx playwright screenshot --viewport-size="375,900" http://127.0.0.1:4173/tools/university-database/ visual-preview/university-portal-mobile.png
          npx playwright screenshot --viewport-size="1366,900" http://127.0.0.1:4173/tools/university-database/tokyo/ visual-preview/tokyo-pc.png
          npx playwright screenshot --viewport-size="375,900" http://127.0.0.1:4173/tools/university-database/tokyo/ visual-preview/tokyo-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: database-entry-visual-preview
          path: visual-preview/*.png
