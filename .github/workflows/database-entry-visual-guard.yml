name: Database entry visual guard
on:
  pull_request:
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'
  push:
    branches: [main]
    paths:
      - 'databases/**'
      - 'assets/images/databases-gateway-*.jpg'
      - 'assets/images/databases-gateway-*.png'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'

jobs:
  visual-entry-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify navigation and capture screenshots
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const pages = [
              ['databases','/databases/'],
              ['university-portal','/tools/university-database/'],
              ['tokyo','/tools/university-database/tokyo/']
            ];
            for (const [name,path] of pages) {
              for (const [suffix,width,height] of [['pc',1366,900],['mobile',375,900]]) {
                const page = await browser.newPage({viewport:{width,height}});
                await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth <= window.innerWidth + 1), true, `${name}-${suffix}: horizontal overflow`);
                await page.screenshot({path:`visual-preview/${name}-${suffix}.png`,fullPage:false});
                await page.close();
              }
            }
            const hub = await browser.newPage({viewport:{width:1366,height:900}});
            await hub.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            // The current gateway is the restored image menu plus mobile cards.
            const gateway=hub.locator('.db-visual-menu');
            await gateway.waitFor({state:'visible'});
            const art=gateway.locator('#database-gateway-art');
            await art.waitFor({state:'visible'});
            assert.ok(await art.evaluate(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0),'gateway artwork must load');
            const artBox=await art.boundingBox();
            assert.ok(artBox&&artBox.width>1000&&artBox.height>250,'desktop gateway artwork has no usable area');
            const expected=[
              ['.hot-school-card','/tools/school-database/'],
              ['.hot-stats-card','/tools/school-database/analytics/'],
              ['.hot-textbook-card','/resources/textbook-plans/'],
              ['.hot-university-card','/tools/university-database/']
            ];
            for(const [selector,href] of expected){
              const link=gateway.locator(selector);
              assert.equal(await link.count(),1);
              assert.equal(await link.getAttribute('href'),href);
              assert.ok(await link.getAttribute('aria-label'),'hotspot needs accessible name');
              const box=await link.boundingBox();
              assert.ok(box&&box.width>100&&box.height>80,'desktop hotspot has no usable area');
              assert.ok(box.x>=artBox.x-1&&box.y>=artBox.y-1&&box.x+box.width<=artBox.x+artBox.width+1&&box.y+box.height<=artBox.y+artBox.height+1,'hotspot must stay inside artwork');
              await link.click({trial:true});
            }
            const hubText=await hub.locator('body').innerText();
            assert.equal(hubText.includes('東京144大学'),false,'obsolete Tokyo-only wording remains');
            await gateway.screenshot({path:'visual-preview/databases-gateway-pc.png'});
            const mobile=await browser.newPage({viewport:{width:375,height:900}});
            await mobile.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            const fallback=mobile.locator('.db-mobile-fallback');
            await fallback.waitFor({state:'visible'});
            assert.equal(await fallback.locator('.db-card').count(),4);
            for(const [,href] of expected){
              const card=fallback.locator(`.db-card[href="${href}"]`);
              assert.equal(await card.count(),1);
              const box=await card.boundingBox();
              assert.ok(box&&box.width>180&&box.height>=44,'mobile card has no usable touch area');
              await card.click({trial:true});
            }
            await fallback.screenshot({path:'visual-preview/databases-gateway-mobile.png'});
            await mobile.close();
            await hub.close();

            const tokyo = await browser.newPage({viewport:{width:1366,height:900}});
            await tokyo.goto('http://127.0.0.1:4173/tools/university-database/tokyo/?packs=0&limit=144',{waitUntil:'networkidle'});
            await tokyo.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length>=144,null,{timeout:25000});
            const topButton=tokyo.locator('button[aria-label="ページ上部へ戻る"]').first();
            await topButton.waitFor({state:'attached'});
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'hidden','top button should start hidden');
            await tokyo.evaluate(()=>window.scrollTo(0,Math.max(900,document.documentElement.scrollHeight*0.45)));
            await tokyo.waitForTimeout(300);
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'visible','top button should appear after scrolling');
            const before=await tokyo.evaluate(()=>window.scrollY);
            assert.ok(before>520,'test page should be scrolled');
            await topButton.click();
            await tokyo.waitForFunction(()=>window.scrollY<80,null,{timeout:3000});
            const text = await tokyo.locator('body').innerText();
            assert.equal(text.includes('公開準備中'), false, 'Tokyo page still contains pre-release wording');
            assert.equal(text.includes('144'), true, 'Tokyo snapshot mode should show 144 universities');
            await tokyo.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-entry-visual-preview
          path: visual-preview/*.png
