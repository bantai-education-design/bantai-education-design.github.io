name: Database entry visual guard
on:
  pull_request:
    paths:
      - 'databases/**'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'
  push:
    branches: [main]
    paths:
      - 'databases/**'
      - 'assets/css/database-hub-v2.css'
      - 'tools/university-database/**'
      - '.github/workflows/database-entry-visual-guard.yml'

jobs:
  visual-entry-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify navigation and capture screenshots
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const pages = [
              ['databases','/databases/'],
              ['university-portal','/tools/university-database/'],
              ['tokyo','/tools/university-database/tokyo/']
            ];
            for (const [name,path] of pages) {
              for (const [suffix,width,height] of [['pc',1366,900],['mobile',375,900]]) {
                const page = await browser.newPage({viewport:{width,height}});
                await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth <= window.innerWidth + 1), true, `${name}-${suffix}: horizontal overflow`);
                await page.screenshot({path:`visual-preview/${name}-${suffix}.png`,fullPage:false});
                await page.close();
              }
            }
            const hub = await browser.newPage({viewport:{width:1366,height:900}});
            await hub.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            const expected = [
              ['全国学校データベースを開く','/tools/school-database/'],
              ['教科書会社・年間指導計画を開く','/resources/textbook-plans/'],
              ['東京都144大学データベースを開く','/tools/university-database/tokyo/']
            ];
            for (const [name,href] of expected) {
              const links = hub.getByRole('link',{name,exact:true});
              assert.ok(await links.count() >= 1, `${name}: missing`);
              assert.equal(await links.first().getAttribute('href'), href, `${name}: wrong href`);
            }
            assert.equal(await hub.locator('.database-scene-card').count(),3,'visual scene cards should be 3');
            await hub.close();

            const tokyo = await browser.newPage({viewport:{width:1366,height:900}});
            await tokyo.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            const topButton=tokyo.getByRole('button',{name:'ページ上部へ戻る',exact:true});
            await topButton.waitFor({state:'attached'});
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'hidden','top button should start hidden');
            await tokyo.evaluate(()=>window.scrollTo(0,Math.max(900,document.documentElement.scrollHeight*0.45)));
            await tokyo.waitForTimeout(300);
            assert.equal(await topButton.evaluate(el=>getComputedStyle(el).visibility),'visible','top button should appear after scrolling');
            const before=await tokyo.evaluate(()=>window.scrollY);
            assert.ok(before>520,'test page should be scrolled');
            await topButton.click();
            await tokyo.waitForFunction(()=>window.scrollY<80,null,{timeout:3000});
            const text = await tokyo.locator('body').innerText();
            assert.equal(text.includes('公開準備中'), false, 'Tokyo page still contains pre-release wording');
            assert.equal(text.includes('144'), true, 'Tokyo page should show 144 universities');
            await tokyo.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-entry-visual-preview
          path: visual-preview/*.png
