name: Database menu preserve guard

on:
  pull_request:
    paths:
      - 'databases/**'
      - 'assets/site.js'
      - 'assets/style.css'
      - 'assets/images/databases-gateway-hero.jpg'
      - 'tools/university-database/**'
      - '.github/workflows/database-menu-preserve-guard.yml'
  push:
    branches: [main]
    paths:
      - 'databases/**'
      - 'assets/site.js'
      - 'assets/style.css'
      - 'assets/images/databases-gateway-hero.jpg'
      - 'tools/university-database/**'
      - '.github/workflows/database-menu-preserve-guard.yml'

jobs:
  database-menu-preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/database-menu-site.log 2>&1 &
          sleep 2
      - name: Preserve database gateway and university route
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});

            for(const viewport of [
              {name:'mid',width:904,height:633},
              {name:'compact',width:820,height:633}
            ]){
              const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
              await page.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
              assert.ok((await page.evaluate(()=>window.scrollY)) < 2, `${viewport.name}: direct load must start at page top`);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,`${viewport.name}: horizontal overflow`);

              const gateway=page.locator('.db-gateway');
              await gateway.waitFor({state:'visible'});
              assert.equal(await page.locator('#database-gateway-art').count(),0,`${viewport.name}: obsolete gateway artwork remains`);
              assert.equal(await page.locator('.db-service').count(),4,`${viewport.name}: service card count changed`);
              const bodyText=await page.locator('body').innerText();
              assert.equal(bodyText.includes('東京144大学'),false,`${viewport.name}: obsolete Tokyo-only wording remains`);
              const expected=[
                ['/tools/school-database/','学校情報'],
                ['/resources/textbook-plans/','教科書・年間指導計画'],
                ['/tools/school-database/analytics/','地域・統計データ'],
                ['/tools/university-database/','全国大学データベース']
              ];
              for(const [href,label] of expected){
                const card=page.locator(`.db-service[href="${href}"]`);
                assert.equal(await card.count(),1,`${viewport.name}: missing ${label}`);
                assert.ok((await card.innerText()).includes(label),`${viewport.name}: missing label ${label}`);
              }
              assert.ok(bodyText.includes('全国の大学情報')&&bodyText.includes('地域を限定せず'),`${viewport.name}: nationwide university guidance missing`);

              if(viewport.width<=860){
                const toggle=page.locator('.menu-toggle');
                assert.equal(await toggle.count(),1,'compact: menu toggle missing');
                await toggle.click();
                assert.equal(await toggle.getAttribute('aria-expanded'),'true','compact: menu did not open');
                assert.equal(await page.evaluate(()=>document.body.classList.contains('menu-open')),true,'compact: menu-open state missing');
                await page.keyboard.press('Escape');
                assert.equal(await toggle.getAttribute('aria-expanded'),'false','compact: menu did not close with Escape');
              }

              await page.screenshot({path:`visual-preview/databases-${viewport.name}.png`,fullPage:false});
              await page.close();
            }

            const route=await browser.newPage({viewport:{width:904,height:633}});
            await route.goto('http://127.0.0.1:4173/databases/',{waitUntil:'networkidle'});
            await route.locator('.db-service[href="/tools/university-database/"]').click();
            await route.waitForURL('**/tools/university-database/');
            const photoEntry=route.locator('a[href="/tools/university-database/tokyo/photo-submit/"]').first();
            await photoEntry.waitFor({state:'visible'});
            assert.ok((await photoEntry.innerText()).includes('大学写真を送る'),'university hub must expose simple visitor photo submission');
            const tokyoEntry=route.locator('a[href="/tools/university-database/tokyo/"]').first();
            await tokyoEntry.click();
            await route.waitForURL('**/tools/university-database/tokyo/');
            await route.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length>=209,{timeout:25000});
            assert.ok(await route.locator('.tokyo-card[data-card-ready="true"]').count()>=209,'University database must remain reachable with all 209 published cards');
            await route.close();

            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-menu-preserve-preview
          path: visual-preview/*.png
