name: University photo quick register guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'tools/university-database/tokyo/data/user-photo-overrides.json'
      - 'tools/university-database/tokyo/data/universities_tokyo_all.generated.json'
      - 'tools/university-database/tokyo/assets/ai-card-images.js'
      - 'tools/university-database/tokyo/assets/detail-layer.js'
      - '.github/workflows/university-photo-quick-register-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'tools/university-database/tokyo/data/user-photo-overrides.json'
      - 'tools/university-database/tokyo/data/universities_tokyo_all.generated.json'
      - 'tools/university-database/tokyo/assets/ai-card-images.js'
      - 'tools/university-database/tokyo/assets/detail-layer.js'
      - '.github/workflows/university-photo-quick-register-guard.yml'

jobs:
  quick-register-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate batch and shared-photo architecture
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('tools/university-database/tokyo/photo-register/index.html','utf8');
          const js=fs.readFileSync('tools/university-database/tokyo/photo-register/photo-register.js','utf8');
          const detail=fs.readFileSync('tools/university-database/tokyo/assets/detail-layer.js','utf8');
          const overlay=fs.readFileSync('tools/university-database/tokyo/assets/ai-card-images.js','utf8');
          const rows=JSON.parse(fs.readFileSync('tools/university-database/tokyo/data/universities_tokyo_all.generated.json','utf8'));
          assert.equal(rows.length,144,'Tokyo university list must stay 144');
          assert.match(html,/type="file"[^>]+multiple hidden/,'multiple photo input required');
          assert.match(html,/id="zoom"[^>]+min="100"[^>]+max="125"/,'crop zoom limited to 100-125%');
          assert.match(html,/id="brightness"[^>]+min="90"[^>]+max="110"/,'brightness limited to +/-10%');
          assert.match(html,/id="contrast"[^>]+min="90"[^>]+max="110"/,'contrast limited to +/-10%');
          assert.match(html,/width="720" height="405"/,'fixed 16:9 output canvas');
          assert.ok(html.includes('一覧カード + 詳細画面'),'shared surfaces must be visible');
          assert.ok(js.includes("surfaces:['card','detail']"),'batch records must target card and detail');
          assert.ok(js.includes("scene_integrity:'scene_unchanged'"),'scene integrity flag required');
          assert.ok(js.includes('ai_redraw:false'),'AI redraw must be disabled');
          assert.ok(js.includes("forbidden_adjustments:['generative_redraw','object_addition','object_removal','background_replacement','scene_composite']"),'forbidden scene changes required');
          assert.ok(js.includes('makeZip(entries)'),'single ZIP batch export required');
          assert.doesNotMatch(js,/fillText\(|strokeText\(|globalCompositeOperation|removeBackground|inpaint|outpaint/i,'no scene-generating canvas operations');
          assert.ok(overlay.includes('window.__universityOwnerPhotos'),'persistent owner-photo map required');
          assert.ok(overlay.includes('window.__universityOwnerPhotos.set(id,record)'),'owner photo must persist independently of async image reloads');
          assert.ok(detail.includes('window.__universityOwnerPhotos?.get(row.id)'),'detail must prioritize persistent owner photo');
          assert.ok(overlay.includes('state.images.set(id,record)'),'owner override must also feed shared state');
          console.log('batch quick register architecture validated');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/photo-register-site.log 2>&1 &
          sleep 2
      - name: Verify two-photo batch, ZIP readiness and shared detail image
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNkYGD4z8DAwMDAxAADAAANHQEDasKb6QAAAABJRU5ErkJggg==','base64');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900},acceptDownloads:true});
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await page.setInputFiles('#photo-input',[
              {name:'u000094-亜細亜大学.png',mimeType:'image/png',buffer:png},
              {name:'u000001-東京大学.png',mimeType:'image/png',buffer:png}
            ]);
            await page.waitForFunction(()=>document.querySelectorAll('.batch-row').length===2,{timeout:10000});
            const vals=await page.locator('.row-university').evaluateAll(xs=>xs.map(x=>x.value).sort());
            assert.deepEqual(vals,['u000001','u000094'],'filename auto matching');
            assert.equal(await page.locator('#generate-batch').isEnabled(),true,'batch generation enabled');
            await page.click('#generate-batch');
            await page.waitForFunction(()=>!document.querySelector('#result').hidden,{timeout:10000});
            assert.equal(await page.locator('#download-zip').isEnabled(),true,'ZIP download enabled');
            const registry=JSON.parse(await page.locator('#json-output').inputValue());
            for(const id of ['u000001','u000094']){
              assert.equal(registry.records[id].scene_integrity,'scene_unchanged');
              assert.equal(registry.records[id].ai_redraw,false);
              assert.deepEqual(registry.records[id].surfaces,['card','detail']);
              assert.equal(registry.records[id].card_file.width,720);
              assert.equal(registry.records[id].card_file.height,405);
              assert.match(registry.records[id].source_file.sha256,/^[0-9a-f]{64}$/);
              assert.match(registry.records[id].card_file.sha256,/^[0-9a-f]{64}$/);
            }
            await page.setViewportSize({width:375,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'no mobile horizontal overflow');

            const db=await browser.newPage({viewport:{width:1366,height:950}});
            await db.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await db.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,{timeout:15000});
            await db.waitForFunction(()=>window.__universityOwnerPhotos?.get('u000094')?.image_url==='assets/card-images/asia-university-bantai.jpg',{timeout:10000});
            await db.waitForFunction(()=>document.querySelector('.tokyo-card[data-id="u000094"] .real-university-image img')?.getAttribute('src')==='assets/card-images/asia-university-bantai.jpg',{timeout:10000});
            const card=db.locator('.tokyo-card[data-id="u000094"]');
            const cardSrc=await card.locator('.real-university-image img').getAttribute('src');
            await card.locator('.card-detail-open').click();
            await db.waitForSelector('#university-detail-dialog[open]',{timeout:10000});
            const detailVisual=db.locator('#university-detail-dialog .detail-visual');
            await detailVisual.waitFor({state:'visible',timeout:10000});
            assert.equal(await detailVisual.locator('img').count(),1,'detail must render owner photo image');
            const detailSrc=await detailVisual.locator('img').getAttribute('src');
            assert.equal(detailSrc,cardSrc,'card and detail must use the same owner photo');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
