name: Apply Tokyo photo batch 9 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch9-20260823]
    paths:
      - '.github/workflows/apply-photo-batch9-once.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch9-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add three verified real-photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const before=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(before!==33) throw new Error(`expected 33 verified photos before batch 9, got ${before}`);
          const records={
            u000004:{
              university_id:'u000004',university_name:'東京農工大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/e/e0/Tokyo_University_of_Agriculture_and_Technology.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Tokyo_University_of_Agriculture_and_Technology.jpg',
              source_label:'写真・ライセンス',creator:'Wiiii',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Wiiiii、CC0 1.0による公開を確認。東京農工大学農学部本館の実景写真として、出典・作者・原画像を追跡できる状態で掲載する。',
              alt:'東京農工大学農学部本館',reviewed_at:'2026-08-23'
            },
            u000005:{
              university_id:'u000005',university_name:'東京藝術大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/8/8c/2025_Tokyo_University_of_the_Arts.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:2025_Tokyo_University_of_the_Arts.jpg',
              source_label:'写真・ライセンス',creator:'Kakidai',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Kakidai、投稿者自身の作品、CC BY-SA 4.0を確認。東京藝術大学上野キャンパス正門の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'東京藝術大学上野キャンパス正門',reviewed_at:'2026-08-23'
            },
            u000007:{
              university_id:'u000007',university_name:'東京海洋大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/7/79/Administration_Building_-_Tokyo_University_of_Marine_Science_and_Technology_-_DSC00940.JPG',
              source_url:'https://commons.wikimedia.org/wiki/File:Administration_Building_-_Tokyo_University_of_Marine_Science_and_Technology_-_DSC00940.JPG',
              source_label:'写真・ライセンス',creator:'Daderot',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Daderot、投稿者自身の作品、CC0 1.0による公開を確認。東京海洋大学品川キャンパス管理棟の実景写真として、出典・作者・原画像を追跡できる状態で掲載する。',
              alt:'東京海洋大学品川キャンパス管理棟',reviewed_at:'2026-08-23'
            }
          };
          for(const [id,row] of Object.entries(records)){
            if(data.images[id]?.rights_status==='verified') throw new Error(`${id} already verified`);
            data.images[id]=row;
          }
          const after=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(after!==36) throw new Error(`expected 36 verified photos after batch 9, got ${after}`);
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`verified real university photos ${before} -> ${after}`);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'data: add verified Tokyo university photos batch 9'
          git push origin HEAD:feature/tokyo-real-photos-batch9-20260823
