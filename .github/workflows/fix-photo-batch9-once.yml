name: Fix Tokyo photo batch 9 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch9-20260823]
    paths:
      - '.github/workflows/fix-photo-batch9-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch9-20260823
      - name: Correct Tokyo agriculture creator note
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const verified=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(verified!==36) throw new Error(`expected 36 verified photos, got ${verified}`);
          const row=data.images?.u000004;
          if(!row || row.creator!=='Wiiii') throw new Error('u000004 creator mismatch');
          row.rights_note='Wikimedia Commonsの個別ファイルページで作者Wiiii、CC0 1.0による公開を確認。東京農工大学農学部本館の実景写真として、出典・作者・原画像を追跡できる状態で掲載する。';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'fix: correct Tokyo agriculture photo attribution note'
          git push origin HEAD:feature/tokyo-real-photos-batch9-20260823
