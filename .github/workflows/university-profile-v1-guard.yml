name: University profile v1 guard
on:
  pull_request:
    paths:
      - 'tools/university-database/**'
      - '.github/workflows/university-profile-v1-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/**'
      - '.github/workflows/university-profile-v1-guard.yml'

jobs:
  university-profile-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Validate scripts and complete profile data
        run: |
          node --check tools/university-database/tokyo/assets/tokyo.js
          node --check tools/university-database/tokyo/assets/detail.js
          node --check tools/university-database/tokyo/assets/detail-router-v2.js
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const dir='tools/university-database/tokyo/data/complete';
          const files=fs.readdirSync(dir).filter(x=>/^u\d{6}\.json$/.test(x)).sort();
          assert.ok(files.length>=2,'at least two complete profiles expected');
          const expected={u000001:{name:'東京大学',faculties:10,units:44,programs:79,graduate:15},u000002:{name:'東京外国語大学',faculties:3,units:3,programs:49,graduate:1}};
          const required=['schema_version','university_id','name','establishment_type','status','official_url','student_counts','academics','graduate_schools','campuses','tuition','admissions','qualifications','careers','research','sports_culture','notable_alumni','sources','verification'];
          for(const file of files){
            const p=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
            for(const key of required) assert.ok(Object.hasOwn(p,key),`${file}: missing ${key}`);
            assert.equal(p.schema_version,'1.0');
            assert.equal(file,`${p.university_id}.json`);
            assert.equal(p.id,p.university_id);
            const departments=p.academics.flatMap(f=>f.departments||[]),programs=departments.flatMap(d=>d.programs||[]),gp=p.graduate_schools.flatMap(g=>g.programs||[]),e=expected[p.university_id];
            if(e){assert.equal(p.name,e.name);assert.equal(p.academics.length,e.faculties);assert.equal(departments.length,e.units);assert.equal(programs.length,e.programs);assert.equal(p.graduate_schools.length,e.graduate)}
            if(Number.isInteger(p.student_counts.undergraduate)&&Number.isInteger(p.student_counts.graduate)&&Number.isInteger(p.student_counts.total))assert.equal(p.student_counts.undergraduate+p.student_counts.graduate,p.student_counts.total);
            const sourceIds=new Set(p.sources.map(x=>x.source_id)),campusIds=new Set(p.campuses.map(x=>x.campus_id));
            for(const f of p.academics)for(const cid of f.campus_ids||[])assert.ok(campusIds.has(cid));
            const walk=x=>{if(Array.isArray(x)){x.forEach(walk);return}if(!x||typeof x!=='object')return;for(const [k,v]of Object.entries(x)){if(k==='source_id'&&v)assert.ok(sourceIds.has(v),`${file}: bad source ${v}`);else if(k==='source_ids')for(const sid of v||[])assert.ok(sourceIds.has(sid));else walk(v)}};walk(p);
            console.log(`${p.name}: faculties=${p.academics.length}, units=${departments.length}, programs=${programs.length}, graduate=${p.graduate_schools.length}`);
          }
          NODE
      - name: Validate Tokyo academic snapshot coverage
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const base='tools/university-database/tokyo/data';
          const snapshots=['academic-structure-batches-03-08.json','academic-structure-batches-09-12.json','academic-structure-batches-13-14.json','academic-structure-batches-15-17.json','academic-structure-batches-18-22.json','academic-structure-major-01.json','academic-structure-medical-01-02.json','academic-structure-private-02.json','academic-structure-private-03.json','academic-structure-private-04.json','academic-structure-private-05.json','academic-structure-private-06.json','academic-structure-private-07.json','academic-structure-private-08.json','academic-structure-tid-professional.json','departments-mejiro-verified.json'];
          const load=name=>{const p=path.join(base,name);return fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):[]};
          const asList=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.entries(v).map(([key,row])=>row&&typeof row==='object'&&!Array.isArray(row)&&!row.university_id&&/^u\d{6}$/.test(key)?{university_id:key,...row}:row):[]);
          const faculties=new Map(),departments=new Map(),graduates=new Map();
          const put=(map,row)=>{if(row?.id)map.set(row.id,row)};
          for(const row of asList(load('faculties.json')))put(faculties,row);
          for(const row of asList(load('departments.json')))put(departments,row);
          for(const row of asList(load('faculties_tokyo_all.generated.json')))put(faculties,row);
          for(const row of asList(load('departments_tokyo_all.generated.json')))put(departments,row);
          for(const row of asList(load('graduate_schools_tokyo_all.generated.json')))put(graduates,row);
          for(const name of snapshots){
            const doc=load(name);if(!doc||Array.isArray(doc))continue;
            if(doc.kind==='academic_structure'){
              for(const u of asList(doc.universities)){const uid=u?.university_id||u?.id;for(const f of asList(u?.faculties)){put(faculties,{...f,university_id:f.university_id||uid});for(const d of asList(f?.departments))put(departments,{...d,university_id:d.university_id||uid,faculty_id:d.faculty_id||f.id})}for(const g of asList(u?.graduate_schools))put(graduates,{...g,university_id:g.university_id||uid})}
            }else{const target=doc.kind==='faculties'?faculties:doc.kind==='departments'?departments:doc.kind==='graduate_schools'?graduates:null;if(target)for(const row of asList(doc.records))put(target,row)}
          }
          const universities=asList(load('universities_tokyo_all.generated.json'));
          const covered=new Set([...faculties.values(),...graduates.values()].map(x=>x.university_id).filter(Boolean));
          const missing=universities.filter(u=>!covered.has(u.id)).map(u=>`${u.id}:${u.name}`);
          console.log(`academic coverage ${covered.size}/${universities.length}`);if(missing.length)console.log('missing:',missing.join(', '));
          const teikyo=[...faculties.values()].filter(x=>x.university_id==='u000102');console.log(`Teikyo faculties=${teikyo.length}: ${teikyo.map(x=>x.name).join('、')}`);
          assert.equal(covered.size,universities.length,'academic snapshot coverage must include all 144 universities');
          assert.equal(teikyo.length,10,'Teikyo should have 10 verified faculties');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify database top, maps, academic basics and profile fallback
        run: |
          mkdir -p visual-preview
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:1000}}),errors=[];
            page.on('pageerror',e=>{errors.push(String(e));console.error('PAGEERROR',e)});page.on('console',m=>{if(m.type()==='error')console.error('BROWSER CONSOLE',m.text())});
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await page.locator('#university-db-development-status').waitFor({state:'visible'});
            assert.ok((await page.locator('body').innerText()).includes('現在 開発・更新中'));
            await page.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,null,{timeout:15000});
            await page.waitForFunction(()=>document.querySelector('#academic-sync-status')?.textContent?.includes('/144'),null,{timeout:15000});
            assert.equal(errors.length,0,`page errors: ${errors.join(' | ')}`);
            const status=await page.locator('#academic-sync-status').innerText();console.log('academic status:',status);assert.ok(status.includes('144/144'),status);
            const teikyo=page.locator('.tokyo-card[data-id="u000102"]');assert.ok((await teikyo.innerText()).includes('学部 10'));
            const mapHref=await teikyo.locator('.map-card-link').getAttribute('href');assert.ok(decodeURIComponent(mapHref).includes('帝京大学'));
            await page.screenshot({path:'visual-preview/tokyo-db-top-pc.png',fullPage:false});await page.setViewportSize({width:375,height:900});assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true);await page.screenshot({path:'visual-preview/tokyo-db-top-mobile.png',fullPage:false});await page.close();
            const base='http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=';
            for(const p of [{id:'u000001',name:'東京大学',faculties:10,phrases:['642,960円','2,858人']},{id:'u000002',name:'東京外国語大学',faculties:3,phrases:['535,800円','579人','府中キャンパス','27の専攻言語']}])for(const [suffix,width,height,fullPage]of[['pc',1366,1000,true],['mobile',375,900,false]]){const profile=await browser.newPage({viewport:{width,height}});await profile.goto(base+p.id,{waitUntil:'networkidle'});await profile.locator('h1').filter({hasText:p.name}).waitFor({state:'visible'});assert.equal(await profile.locator('.complete-section').count(),8);assert.equal(await profile.locator('.complete-academic-card').count(),p.faculties);assert.equal(await profile.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true);const text=await profile.locator('body').innerText();for(const phrase of ['大学の基本情報','学部','学科・課程・類','Google Maps','キャンパス・最寄駅','学費','入試方式・Web出願','資格・進路','研究・スポーツ・著名卒業生','出典・最終確認日','Web出願サイト：公式公開待ち',...p.phrases])assert.ok(text.includes(phrase),`${p.id}: missing ${phrase}`);const href=await profile.locator('a',{hasText:'Google Maps'}).first().getAttribute('href');assert.ok(decodeURIComponent(href).includes(p.name));await profile.screenshot({path:`visual-preview/${p.id}-${suffix}.png`,fullPage});await profile.close()}
            const legacy=await browser.newPage({viewport:{width:1366,height:900}});await legacy.goto(base+'u000003',{waitUntil:'networkidle'});await legacy.locator('h1').filter({hasText:'東京学芸大学'}).waitFor({state:'visible'});assert.equal(await legacy.locator('.complete-section').count(),0);const legacyText=await legacy.locator('body').innerText();for(const phrase of ['大学の基本情報','学部','学科・課程等','基本情報 更新中','Google Maps'])assert.ok(legacyText.includes(phrase),`legacy missing ${phrase}`);const legacyMap=await legacy.locator('a',{hasText:'Google Maps'}).first().getAttribute('href');assert.ok(decodeURIComponent(legacyMap).includes('東京学芸大学'));await legacy.screenshot({path:'visual-preview/u000003-legacy-pc.png',fullPage:false});await legacy.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-profile-v1-preview
          path: visual-preview/*.png
