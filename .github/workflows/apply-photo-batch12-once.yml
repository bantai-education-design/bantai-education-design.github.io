name: Apply Tokyo photo batch 12 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch12-20260823]
    paths:
      - '.github/workflows/apply-photo-batch12-once.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch12-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add six verified real-photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const before=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(before!==48) throw new Error(`expected 48 verified photos before batch 12, got ${before}`);
          const records={
            u000055:{university_id:'u000055',university_name:'東京慈恵会医科大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/7/7d/The_Jikei_University_School_of_Medicine%2C_Kokuryo_Campus.JPG',source_url:'https://commons.wikimedia.org/wiki/File:The_Jikei_University_School_of_Medicine,_Kokuryo_Campus.JPG',source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。東京慈恵会医科大学国領キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'東京慈恵会医科大学国領キャンパス',reviewed_at:'2026-08-23'},
            u000057:{university_id:'u000057',university_name:'東京女子医科大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/8/8c/Tokyo_Women%27s_Medical_University_Hospital_1.JPG',source_url:'https://commons.wikimedia.org/wiki/File:Tokyo_Women%27s_Medical_University_Hospital_1.JPG',source_label:'写真・ライセンス',creator:'Waka77',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Waka77、投稿者自身の作品、CC0 1.0による公開を確認。東京女子医科大学病院の実景写真として、作者・原画像を追跡できる状態で掲載する。',alt:'東京女子医科大学病院の外観',reviewed_at:'2026-08-23'},
            u000064:{university_id:'u000064',university_name:'東京音楽大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/5/58/Tokyo_College_of_Music.jpg',source_url:'https://commons.wikimedia.org/wiki/File:Tokyo_College_of_Music.jpg',source_label:'写真・ライセンス',creator:'Syced',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Syced、投稿者自身の作品、CC0 1.0による公開を確認。東京音楽大学の実景写真として、作者・原画像を追跡できる状態で掲載する。',alt:'東京音楽大学のキャンパス実景',reviewed_at:'2026-08-23'},
            u000074:{university_id:'u000074',university_name:'文化学園大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/8/86/Campus_of_Bunka_Gakuen_University.jpg',source_url:'https://commons.wikimedia.org/wiki/File:Campus_of_Bunka_Gakuen_University.jpg',source_label:'写真・ライセンス',creator:'Suginami',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Suginami、投稿者自身の作品、CC BY-SA 4.0を確認。文化学園大学キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'文化学園大学のキャンパス実景',reviewed_at:'2026-08-23'},
            u000084:{university_id:'u000084',university_name:'立正大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/5/55/20130217_Ris_Campus.JPG',source_url:'https://commons.wikimedia.org/wiki/File:20130217_Ris_Campus.JPG',source_label:'写真・ライセンス',creator:'Mayutansexyz',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Mayutansexyz、投稿者自身の作品、CC BY-SA 3.0を確認。立正大学品川キャンパス正門の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'立正大学品川キャンパス正門',reviewed_at:'2026-08-23'},
            u000096:{university_id:'u000096',university_name:'国立音楽大学',rights_status:'verified',image_url:'https://upload.wikimedia.org/wikipedia/commons/9/91/Kunitachi_College_of_Music.JPG',source_url:'https://commons.wikimedia.org/wiki/File:Kunitachi_College_of_Music.JPG',source_label:'写真・ライセンス',creator:'Nyao148',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',rights_note:'Wikimedia Commonsの個別ファイルページで作者Nyao148、投稿者自身の作品、CC BY-SA 3.0を確認。国立音楽大学の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',alt:'国立音楽大学のキャンパス実景',reviewed_at:'2026-08-23'}
          };
          for(const [id,row] of Object.entries(records)){
            if(data.images[id]?.rights_status==='verified') throw new Error(`${id} already verified`);
            data.images[id]=row;
          }
          const after=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(after!==54) throw new Error(`expected 54 verified photos after batch 12, got ${after}`);
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`verified real university photos ${before} -> ${after}`);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'data: add verified Tokyo university photos batch 12'
          git push origin HEAD:feature/tokyo-real-photos-batch12-20260823

# retrigger 2026-08-23
