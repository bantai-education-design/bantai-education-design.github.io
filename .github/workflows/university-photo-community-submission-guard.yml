name: University photo community submission guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'tools/university-database/tokyo/assets/detail-owner-photo-gallery.js'
      - 'tools/university-database/tokyo/assets/detail-photo-preview.js'
      - 'tools/university-database/tokyo/detail.html'
      - '.github/workflows/university-photo-community-submission-guard.yml'

jobs:
  community-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate community submission source
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const root='tools/university-database/tokyo/photo-register/';
          const rules=fs.readFileSync(root+'PHOTO_SUBMISSION_RULES.md','utf8');
          const ui=fs.readFileSync(root+'community-submission-ui.js','utf8');
          const transport=fs.readFileSync(root+'community-submission-transport.js','utf8');
          const backend=fs.readFileSync(root+'NOTIFICATION_BACKEND.md','utf8');
          const config=JSON.parse(fs.readFileSync(root+'submission-runtime-config.json','utf8'));
          const popup=fs.readFileSync(root+'preview-popup-fix.js','utf8');
          const detail=fs.readFileSync('tools/university-database/tokyo/assets/detail-photo-preview.js','utf8');
          const gallery=fs.readFileSync('tools/university-database/tokyo/assets/detail-owner-photo-gallery.js','utf8');
          assert.ok(rules.includes('最大9枚')&&rules.includes('メイン1枚')&&rules.includes('サブ写真'));
          assert.ok(rules.includes('生成AI')&&rules.includes('公開は自動ではありません'));
          assert.ok(ui.includes('const MAX_PHOTOS=9')&&ui.includes('審査に提出する'));
          assert.ok(ui.includes('community-rule-rights')&&ui.includes('community-rule-no-ai')&&ui.includes('community-rule-license'));
          assert.ok(ui.includes("kind:'bantai_university_photo_submission'")&&ui.includes("review_status:'pending'"));
          assert.ok(transport.includes("mode:'remote'")&&transport.includes("form.append('package'"));
          assert.equal(config.enabled,false,'public branch must not contain an unconfigured live endpoint');
          assert.ok(backend.includes('REVIEW_NOTIFICATION_EMAIL')&&backend.includes('非公開 Storage'));
          assert.ok(popup.includes('.slice(0,9)'),'formal popup preview must allow nine photos');
          assert.ok(detail.includes('.slice(0,9)'),'detail preview receiver must allow nine photos');
          assert.ok(gallery.includes('const MAX_PHOTOS=9')&&gallery.includes('record.gallery'),'published detail gallery must support main plus gallery');
          console.log('community submission, notification hook and gallery source validated');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/community-photo.log 2>&1 &
          sleep 2
      - name: Verify simple flow, nine photos, local fallback and remote notification
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNkYGD4z8DAwMDAxAADAAANHQEDasKb6QAAAABJRU5ErkJggg==','base64');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1366,height:900},acceptDownloads:true});
            const register='http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/';

            const page=await ctx.newPage();
            await page.goto(register,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.documentElement.dataset.communityPhotoSubmission==='ready',{timeout:10000});
            await page.waitForFunction(()=>document.querySelectorAll('#university-first-select option').length===145,{timeout:10000});
            assert.equal(await page.locator('#simple-register-progress li').count(),4,'public flow must stay four steps');
            assert.equal(await page.locator('#registration-mode-switch').isVisible(),false,'batch mode must stay hidden');
            assert.equal(await page.locator('#photo-editor').isVisible(),false,'photo editor must be collapsed by default');
            assert.equal(await page.locator('#community-photo-rules').isVisible(),true,'three-rule confirmation must be visible');
            assert.equal(await page.locator('#community-submit-package').isVisible(),true,'single submit action must be visible');
            assert.ok((await page.locator('#community-submit-package').innerText()).includes('審査用データを保存'));

            await page.locator('#university-first-select').selectOption('u000094');
            await page.waitForFunction(()=>document.querySelectorAll('#existing-photo-choice .main-photo-choice-card').length>=1,{timeout:10000});
            const existing=await page.locator('#existing-photo-choice .main-photo-choice-card').count();
            const addCount=9-existing;
            if(addCount>0){
              const files=Array.from({length:addCount},(_,i)=>({name:`community-${i+1}.png`,mimeType:'image/png',buffer:png}));
              await page.setInputFiles('#photo-input',files);
              await page.waitForFunction(expected=>document.querySelectorAll('.batch-row').length===expected,addCount,{timeout:10000});
            }
            await page.waitForFunction(()=>document.querySelectorAll('#existing-photo-choice .main-photo-choice-card').length===9,{timeout:10000});
            assert.ok((await page.locator('#community-photo-counter').innerText()).includes('9 / 9枚'));
            assert.equal(await page.locator('.main-photo-choice-card.active').count(),1,'exactly one main photo required');
            assert.equal(await page.locator('#open-real-preview').isDisabled(),false,'nine photos must preview');

            const popupPromise=ctx.waitForEvent('page');
            await page.locator('#open-real-preview').click();
            const preview=await popupPromise;
            await preview.waitForURL(/detail\.html\?id=u000094&photo_preview_token=/,{timeout:15000});
            await preview.waitForFunction(()=>document.querySelectorAll('.detail-photo-preview-thumb').length===9,{timeout:15000});
            await preview.close();

            for(const id of ['#community-rule-rights','#community-rule-no-ai','#community-rule-license'])await page.check(id);
            await page.waitForFunction(()=>!document.querySelector('#community-submit-package')?.disabled,{timeout:10000});
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#community-submit-package').click();
            const download=await downloadPromise;
            assert.match(download.suggestedFilename(),/^BT-UP-.*\.zip$/);
            await page.waitForFunction(()=>document.documentElement.dataset.communitySubmissionLast==='saved',{timeout:10000});

            await page.setInputFiles('#photo-input',{name:'tenth.png',mimeType:'image/png',buffer:png});
            await page.waitForFunction(()=>document.querySelectorAll('#existing-photo-choice .main-photo-choice-card').length===10,{timeout:10000});
            assert.equal(await page.locator('#community-submit-package').isDisabled(),true,'tenth photo must block submission');
            assert.equal(await page.locator('#open-real-preview').isDisabled(),true,'tenth photo must block preview');
            await page.setViewportSize({width:375,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'mobile must not overflow horizontally');

            const remote=await ctx.newPage();
            let notifiedRequest=false;
            await remote.route('**/submission-runtime-config.json',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({schema_version:1,enabled:true,mode:'remote',endpoint:'https://notify.example.test/submit'})}));
            await remote.route('https://notify.example.test/submit',async route=>{
              notifiedRequest=true;
              assert.equal(route.request().method(),'POST');
              await route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'http://127.0.0.1:4173','access-control-allow-methods':'POST,OPTIONS'},body:JSON.stringify({ok:true,submission_id:'BT-UP-TEST-001',notified:true,review_status:'pending'})});
            });
            await remote.goto(register,{waitUntil:'domcontentloaded'});
            await remote.waitForFunction(()=>document.documentElement.dataset.submissionTransport==='remote',{timeout:10000});
            await remote.waitForFunction(()=>document.querySelectorAll('#university-first-select option').length===145,{timeout:10000});
            await remote.locator('#university-first-select').selectOption('u000094');
            await remote.waitForFunction(()=>document.querySelectorAll('#existing-photo-choice .main-photo-choice-card').length>=1,{timeout:10000});
            for(const id of ['#community-rule-rights','#community-rule-no-ai','#community-rule-license'])await remote.check(id);
            await remote.waitForFunction(()=>!document.querySelector('#community-submit-package')?.disabled,{timeout:10000});
            assert.equal((await remote.locator('#community-submit-package').innerText()).trim(),'審査に提出する');
            await remote.locator('#community-submit-package').click();
            await remote.waitForFunction(()=>document.documentElement.dataset.communitySubmissionLast==='submitted',{timeout:10000});
            assert.equal(notifiedRequest,true,'remote submission endpoint must receive the package');
            assert.ok((await remote.locator('#community-submit-status').innerText()).includes('BT-UP-TEST-001'));

            const galleryPage=await ctx.newPage();
            const data='data:image/png;base64,'+png.toString('base64');
            await galleryPage.route('**/data/user-photo-overrides.json',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({schema_version:2,records:{u000094:{university_id:'u000094',university_name:'亜細亜大学',rights_status:'verified',image_url:data+'#0',source_url:data+'#0',rights_note:'test',alt:'main',gallery:Array.from({length:8},(_,i)=>({image_url:data+`#${i+1}`,alt:`sub${i+1}`,role:'sub'}))}}})}));
            await galleryPage.goto('http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=u000094',{waitUntil:'domcontentloaded'});
            await galleryPage.waitForFunction(()=>document.querySelectorAll('.detail-owner-photo-thumb').length===9,{timeout:15000});
            assert.equal(await galleryPage.locator('.detail-owner-photo-thumb.active').count(),1);
            const before=await galleryPage.locator('.detail-owner-photo-main').getAttribute('src');
            await galleryPage.locator('.detail-owner-photo-thumb').nth(8).click();
            const after=await galleryPage.locator('.detail-owner-photo-main').getAttribute('src');
            assert.notEqual(after,before,'sub photo must switch large image');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
