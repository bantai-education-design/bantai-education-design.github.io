name: Restore real AI words book proof pages
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  restore-proof-pages:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Restore exact source PDF, verify checksum and render original pages
        shell: bash
        run: |
          set -euo pipefail
          cat .image-restore/ai-words-proof/chunk*.txt | base64 --decode > /tmp/ai-words-proof.pdf
          echo "9e268b68b1218b0f12d47d5db8ba027c15d1159f716a3a276e17c7ce87a5cf67  /tmp/ai-words-proof.pdf" | sha256sum -c -
          python -m pip install --disable-pip-version-check --quiet pymupdf Pillow
          python - <<'PY'
          import fitz
          from pathlib import Path
          from PIL import Image
          doc=fitz.open("/tmp/ai-words-proof.pdf")
          assert len(doc)==7, "Unexpected proof PDF page count"
          names=["chapter-opening","context-example","prompt-example","answer-check","chapter-summary","dictionary","index"]
          folder=Path("assets/images/books/ai-words-intro/pages")
          folder.mkdir(parents=True,exist_ok=True)
          for page_no,name in enumerate(names):
              pix=doc[page_no].get_pixmap(matrix=fitz.Matrix(2.65,2.65),alpha=False)
              im=Image.frombytes("RGB",(pix.width,pix.height),pix.samples)
              im.save(folder/(name+".jpg"),"JPEG",quality=88,optimize=True,subsampling=0)
              print("Rendered verified proof page",page_no+1,name,im.size)
          PY
      - name: Commit only actual proof page images and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/books/ai-words-intro/pages/
          git rm -r .image-restore/ai-words-proof
          git rm .github/workflows/restore-ai-words-book-proof.yml
          git commit -m "Add seven genuine proof page images from verified Google Drive PDF"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
