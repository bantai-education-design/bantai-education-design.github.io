name: University unified region guard

on:
  pull_request:
    paths:
      - 'tools/university-database/saitama/**'
      - 'tools/university-database/index.html'
      - 'tools/university-database/tokyo/**'
      - 'tools/university-database/tokyo-additions/**'
      - 'tools/university-database/kanagawa/**'
      - 'tools/university-database/campuses/**'
      - 'tools/university-database/qualifications/**'
      - '.github/workflows/university-saitama-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/saitama/**'
      - '.github/workflows/university-saitama-guard.yml'

jobs:
  saitama-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Saitama public data
        run: |
          for f in tokyo.js search-type-filter.js region-summary.js detail-router-v2.js card-finish.js detail-layer.js favorites.js; do node --check tools/university-database/tokyo/assets/$f; done
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const dir='tools/university-database/saitama/data/';
          const base=JSON.parse(fs.readFileSync(dir+'universities_saitama_all.generated.json','utf8'));
          const core=JSON.parse(fs.readFileSync(dir+'saitama_core_01.json','utf8')).records;
          const manifest=JSON.parse(fs.readFileSync(dir+'manifest.json','utf8'));
          assert.equal(base.length,28,'28 universities');
          assert.equal(core.length,28,'28 core records');
          assert.deepEqual(base.map(x=>x.id),core.map(x=>x.id),'core ids match base');
          assert.equal(new Set(base.map(x=>x.id)).size,28,'unique ids');
          const by=t=>base.filter(x=>x.establishment_type===t).length;
          assert.deepEqual([by('national'),by('public'),by('private')],[1,1,26],'type counts');
          for(const u of core){
            assert.match(u.official_url||'',/^https?:\/\//,`${u.id} official url`);
            assert.ok(u.headquarters?.address?.startsWith('埼玉県'),`${u.id} address`);
            assert.match(u.headquarters?.postal_code||'',/^\d{3}-\d{4}$/,`${u.id} postal`);
            assert.ok((u.sources||[]).some(s=>s.source_url.includes('mext.go.jp')),`${u.id} MEXT source`);
            assert.ok(fs.existsSync(`${dir}complete/${u.id}.json`),`${u.id} complete profile`);
          }
          assert.equal(manifest.universities,28);
          const tokyoIds=new Set(JSON.parse(fs.readFileSync('tools/university-database/tokyo/data/universities_tokyo_all.generated.json','utf8')).map(x=>x.id));
          assert.ok(base.every(x=>!tokyoIds.has(x.id)),'ids do not collide with Tokyo');
          console.log('saitama data ok');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/saitama-site.log 2>&1 &
          sleep 2
      - name: Verify unified list (Tokyo + Saitama), prefecture filter, search and detail pages
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const readRows=f=>fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):[];
          const tokyoN=readRows('tools/university-database/tokyo/data/universities_tokyo_all.generated.json').length;
          const saitama=readRows('tools/university-database/saitama/data/universities_saitama_all.generated.json');
          const extra=readRows('tools/university-database/tokyo-additions/data/universities_tokyo_additions_all.generated.json');
          const kanagawa=readRows('tools/university-database/kanagawa/data/universities_kanagawa_all.generated.json');
          const total=tokyoN+saitama.length+extra.length;
          const tokyoTotal=tokyoN+extra.filter(x=>x.prefecture==='東京都').length-kanagawa.length;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const watch=(pg,tag)=>{pg.on('pageerror',e=>errors.push(`${tag} pageerror ${e.message}`));pg.on('response',r=>{if(r.status()===404&&r.url().startsWith('http://127.0.0.1')&&!/(faculties|departments)_tokyo_all\.generated\.json|\/data\/complete\/u\d+\.json/.test(r.url()))errors.push(`${tag} 404 `+r.url().replace('http://127.0.0.1:4173',''))})};
            const page=await browser.newPage({viewport:{width:1366,height:950}});watch(page,'list');
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await page.waitForFunction(n=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===n,total,{timeout:30000});
            const count=async()=>page.locator('.tokyo-card').count();
            const body=await page.locator('body').innerText();
            assert.ok(!body.includes('読込エラー'),'no load error');
            assert.ok(body.includes(`${total}大学`)&&body.includes('東京都・埼玉県'),'hero shows unified count');
            for(const [pref,expected] of [['埼玉県',saitama.length],['東京都',tokyoTotal],['all',total]]){
              await page.locator(`.ref-pref-filter [data-ref-pref="${pref}"]`).click();await page.waitForTimeout(300);
              assert.equal(await count(),expected,`quick pref ${pref}`);
              assert.equal(await page.locator('#pref-filters .active').getAttribute('data-pref'),pref,`list pref synced ${pref}`);
            }
            await page.locator('#pref-filters [data-pref="埼玉県"]').click();await page.waitForTimeout(300);
            assert.equal(await count(),saitama.length,'list pref saitama');
            assert.equal(await page.locator('.ref-pref-filter .active').getAttribute('data-ref-pref'),'埼玉県','quick pref synced from list');
            for(const [type,expected] of [['national',1],['public',1],['private',saitama.length-2]]){
              await page.locator(`.ref-type-filter [data-ref-type="${type}"]`).click();await page.waitForTimeout(250);
              assert.equal(await count(),expected,`saitama ${type}`);
            }
            await page.locator('.ref-type-filter [data-ref-type="all"]').click();
            await page.fill('.ref-quick-form input[name="q"]','看護');
            await page.locator('.ref-quick-form button[type="submit"]').click();await page.waitForTimeout(300);
            const nurse=await count();
            assert.ok(nurse>=5&&nurse<saitama.length,`search 看護 within Saitama: ${nurse}`);
            const cards=await page.locator('.tokyo-card').evaluateAll(cs=>cs.map(c=>c.innerText));
            assert.ok(cards.every(t=>t.includes('埼玉県')),'Saitama cards show prefecture');
            await page.locator('.ref-type-filter [data-ref-type="all"]').click();
            await page.fill('.ref-quick-form input[name="q"]','');await page.locator('.ref-quick-form button[type="submit"]').click();await page.waitForTimeout(300);
            const campusIdx=JSON.parse(fs.readFileSync('tools/university-database/campuses/campus_index.json','utf8')).universities;
            const expectCampus=Object.values(campusIdx).filter(v=>v.prefectures.includes('埼玉県')).length;
            assert.ok(await page.locator('.campus-toggle-list').isVisible(),'campus toggle visible for Saitama');
            await page.locator('.campus-toggle-list input').check();await page.waitForTimeout(400);
            assert.equal(await count(),expectCampus,'Saitama incl. campuses');
            assert.equal(await page.locator('.campus-toggle-quick input').isChecked(),true,'quick toggle synced');
            const rikkyo=await page.locator('.tokyo-card[data-id="u000110"] .campus-badge, .tokyo-card .campus-badge').first().innerText();
            assert.ok(rikkyo.includes('埼玉県で学べる'),'campus badge shown: '+rikkyo);
            await page.locator('.campus-toggle-list input').uncheck();await page.waitForTimeout(300);
            assert.equal(await count(),saitama.length,'toggle off returns to HQ-based list');
            await page.locator('#clear-filters').click();await page.waitForTimeout(300);
            assert.equal(await count(),total,'clear filters');
            assert.equal(await page.locator('#pref-filters .active').getAttribute('data-pref'),'all','clear resets prefecture');
            await page.locator('#pref-filters [data-pref="神奈川県"]').click();await page.waitForTimeout(300);
            assert.equal(await count(),kanagawa.length,'kanagawa filter');
            const tokai=await page.locator('.tokyo-card[data-id="u000050"]').innerText();
            assert.ok(tokai.includes('神奈川県')&&tokai.includes('平塚市'),'Tokai shown as Kanagawa: '+tokai.slice(0,120));
            await page.locator('#pref-filters [data-pref="all"]').click();await page.waitForTimeout(300);
            const dokkyo=page.locator('.tokyo-card[data-id="u000169"]');
            assert.ok((await dokkyo.innerText()).includes('草加市'),'Dokkyo card');
            assert.ok((await dokkyo.locator('.card-actions a.primary').getAttribute('href')).startsWith('https://nyushi.dokkyo.ac.jp'),'admissions link');
            assert.ok((await page.locator('.tokyo-card[data-id="u000155"]').innerText()).includes('日本栄養大学'),'renamed university');
            const photos=await page.locator('.tokyo-card .real-university-image').count();
            await page.locator('#pref-filters [data-pref="埼玉県"]').click();await page.waitForTimeout(300);
            const saitamaPhotos=await page.locator('.tokyo-card .real-university-image').count();
            assert.ok(saitamaPhotos>=26,`Saitama cards with verified photos: ${saitamaPhotos}`);
            const src=await page.locator('.tokyo-card[data-id="u000169"] img.university-card-image').getAttribute('src');
            assert.ok(/commons\.wikimedia\.org|upload\.wikimedia\.org/.test(src||''),'Dokkyo photo from Commons: '+src);
            assert.equal(await page.locator('.tokyo-card[data-id="u000169"] .image-source-link').count(),1,'photo source link');
            await page.locator('#pref-filters [data-pref="all"]').click();await page.waitForTimeout(300);
            console.log('::notice title=Photos::all '+photos+' / saitama '+saitamaPhotos);
            const quals=JSON.parse(fs.readFileSync('tools/university-database/qualifications/qualifications.json','utf8')).universities;
            const nurseN=Object.values(quals).filter(v=>v.qualifications.some(x=>x.group==='看護師')).length;
            await page.waitForSelector('#qual-select');
            await page.selectOption('#qual-select','看護師');await page.waitForTimeout(400);
            assert.equal(await count(),nurseN,'qualification filter 看護師');
            assert.equal(await page.locator('#qual-select-quick').inputValue(),'看護師','quick qualification select synced');
            assert.ok((await page.locator('.tokyo-card .qual-chip.is-match').count())>=1,'matching qualification chip');
            await page.selectOption('#qual-select','');await page.waitForTimeout(300);
            assert.equal(await count(),total,'qualification cleared');
            const access=JSON.parse(fs.readFileSync('tools/university-database/access/access.json','utf8')).universities;
            assert.ok(Object.keys(access).length>=18,'access records');
            await page.waitForSelector('.tokyo-card .access-line',{timeout:15000});
            await page.fill('.ref-quick-form input[name="q"]','獨協大学前');await page.locator('.ref-quick-form button[type="submit"]').click();await page.waitForTimeout(400);
            assert.equal(await count(),1,'station name search');
            assert.ok((await page.locator('.tokyo-card .access-line').first().innerText()).includes('獨協大学前'),'station shown on card');
            await page.fill('.ref-quick-form input[name="q"]','');await page.locator('.ref-quick-form button[type="submit"]').click();await page.waitForTimeout(400);
            assert.equal(await count(),total,'station search cleared');
            const area=await page.locator('.ref-area').innerText();
            assert.ok(area.includes('東京都')&&area.includes('埼玉県')&&area.includes(String(total)),area);
            // 静的に書かれた大学数（DBトップ・一覧の初期表示・サイトトップ）が実データと一致すること
            const prefN=p=>page.evaluate(x=>state.rows.filter(r=>((r.region_override&&r.region_override.prefecture)||r.prefecture||(r.headquarters&&r.headquarters.prefecture))===x).length,p);
            const tokyoN=await prefN('東京都'),saitamaN=await prefN('埼玉県');
            const dbTop=fs.readFileSync('tools/university-database/index.html','utf8');
            assert.ok(dbTop.includes(`<strong>${tokyoN}</strong><span>東京都の大学`),'DB top Tokyo count '+tokyoN);
            assert.ok(dbTop.includes(`<strong>${saitamaN}</strong><span>埼玉県の大学`),'DB top Saitama count '+saitamaN);
            assert.ok(dbTop.includes(`<strong>${total}</strong><span>収録大学の合計`)&&dbTop.includes(`${total}大学 公式情報確認済み`),'DB top total '+total);
            assert.ok(fs.readFileSync('tools/university-database/tokyo/index.html','utf8').includes(`合計 <strong>${total}</strong> 大学`),'list static total '+total);
            assert.ok(fs.readFileSync('index.html','utf8').includes(`${total}校`),'site top count '+total);
            await page.setViewportSize({width:375,height:900});await page.waitForTimeout(300);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,'no mobile overflow');
            await page.close();
            const deep=await browser.newPage();watch(deep,'deeplink');
            await deep.goto('http://127.0.0.1:4173/tools/university-database/tokyo/?pref=saitama',{waitUntil:'networkidle'});
            await deep.waitForFunction(n=>document.querySelectorAll('.tokyo-card').length===n,saitama.length,{timeout:30000});
            await deep.close();
            const redirect=await browser.newPage();
            await redirect.goto('http://127.0.0.1:4173/tools/university-database/saitama/',{waitUntil:'networkidle'});
            assert.ok(redirect.url().includes('/tokyo/'),'saitama/ redirects to unified page: '+redirect.url());
            await redirect.waitForFunction(n=>document.querySelectorAll('.tokyo-card').length===n,saitama.length,{timeout:30000});
            await redirect.goto('http://127.0.0.1:4173/tools/university-database/saitama/detail.html?id=u000169',{waitUntil:'networkidle'});
            assert.ok(redirect.url().includes('/tokyo/detail.html?id=u000169'),'saitama detail redirects: '+redirect.url());
            await redirect.waitForSelector('.complete-stations li',{timeout:15000});
            assert.ok((await redirect.locator('.complete-stations').first().innerText()).includes('獨協大学前'),'detail shows nearest station');
            await redirect.close();
            const ids=[...saitama.map(x=>x.id),...extra.map(x=>x.id)];
            const summary=[];
            for(const id of ids){
              const d=await browser.newPage({viewport:{width:1280,height:900}});watch(d,id);
              await d.goto(`http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=${id}`,{waitUntil:'networkidle'});
              await d.waitForSelector('.complete-hero h1',{timeout:15000});
              const t=await d.locator('#detail-root').innerText();
              assert.ok(/埼玉県|東京都/.test(t),`${id} detail prefecture`);
              summary.push(`${id}:${(await d.locator('.complete-hero h1').innerText()).trim()}`);
              await d.close();
            }
            console.log('::notice title=Region detail::'+summary.join(' '));
            const td=await browser.newPage({viewport:{width:1280,height:900}});watch(td,'u000050');
            await td.goto('http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=u000050',{waitUntil:'networkidle'});
            await td.waitForFunction(()=>/平塚市/.test(document.querySelector('#detail-root')?.innerText||''),null,{timeout:15000});
            const tt=await td.locator('#detail-root').innerText();
            assert.ok(!tt.includes('港区高輪2-3-23')||tt.includes('品川キャンパス'),'Tokai detail uses Hiratsuka HQ');
            await td.close();
            const tokyoDetail=await browser.newPage();watch(tokyoDetail,'u000001');
            await tokyoDetail.goto('http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=u000001',{waitUntil:'networkidle'});
            await tokyoDetail.waitForSelector('.complete-hero h1',{timeout:15000});
            await tokyoDetail.close();
            const entry=await browser.newPage();
            await entry.goto('http://127.0.0.1:4173/tools/university-database/',{waitUntil:'networkidle'});
            assert.equal(await entry.locator('a[href="/tools/university-database/tokyo/?pref=saitama"]').count(),1,'entry links to Saitama filter');
            await entry.close();
            assert.deepEqual([...new Set(errors)],[],'no script errors or missing local files');
            await browser.close();
            console.log('unified UI ok');
          })().catch(err=>{console.log('::error title=Unified UI::'+String(err.message||err).replace(/\n/g,' ').slice(0,900));process.exit(1)});
          NODE
