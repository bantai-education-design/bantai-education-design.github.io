name: University photo simple submit guard

on:
  pull_request:
    paths:
      - 'tools/university-database/index.html'
      - 'tools/university-database/tokyo/photo-submit/**'
      - 'tools/university-database/tokyo/photo-admin/index.html'
      - 'tools/university-database/tokyo/photo-admin/README.md'
      - 'tools/university-database/tokyo/assets/photo-register-entry.js'
      - 'tools/university-database/tokyo/assets/detail-photo-submit-entry.js'
      - 'tools/university-database/tokyo/detail.html'
      - 'admin/index.html'
      - 'admin/photo-review-config.json'
      - 'admin/photo-review-runtime.js'
      - '.github/workflows/university-photo-simple-submit-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate simple submit architecture
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('tools/university-database/tokyo/photo-submit')
          html = (root / 'index.html').read_text(encoding='utf-8')
          js = (root / 'photo-submit.js').read_text(encoding='utf-8')
          cfg = json.loads((root / 'receiver-config.json').read_text(encoding='utf-8'))
          spec = (root / 'JOTFORM_RECEIVER_SPEC.md').read_text(encoding='utf-8')
          hub_html = Path('tools/university-database/index.html').read_text(encoding='utf-8')
          top_entry = Path('tools/university-database/tokyo/assets/photo-register-entry.js').read_text(encoding='utf-8')
          detail_entry = Path('tools/university-database/tokyo/assets/detail-photo-submit-entry.js').read_text(encoding='utf-8')
          detail_html = Path('tools/university-database/tokyo/detail.html').read_text(encoding='utf-8')
          admin_html = Path('admin/index.html').read_text(encoding='utf-8')
          admin_js = Path('admin/photo-review-runtime.js').read_text(encoding='utf-8')
          admin_cfg = json.loads(Path('admin/photo-review-config.json').read_text(encoding='utf-8'))
          bundle = '\n'.join([
              html, js, json.dumps(cfg, ensure_ascii=False), spec,
              hub_html, top_entry, detail_entry, detail_html,
              admin_html, admin_js, json.dumps(admin_cfg, ensure_ascii=False)
          ])

          forbidden_ui = ['photo-editor', 'メイン写真を選', '明るさを調整', '傾き補正', 'トリミング']
          for token in forbidden_ui:
              assert token not in html, f'visitor submit UI must not contain: {token}'

          assert 'ban.tai3educationdesign@gmail.com' not in bundle, 'notification email must remain provider-side only'
          for token in ['api_key', 'API_KEY', 'secret_key', 'service_role']:
              assert token not in bundle, f'public receiver files must not contain secret field: {token}'

          assert cfg.get('provider') == 'jotform'
          if cfg.get('enabled'):
              url = cfg.get('embed_url', '')
              assert re.match(r'^https://(form\.)?jotform\.com/', url), 'enabled receiver must use an HTTPS Jotform form URL'
          else:
              assert not cfg.get('embed_url'), 'disabled receiver should not expose a stale form URL'

          assert admin_cfg.get('provider') == 'jotform'
          if admin_cfg.get('enabled'):
              assert re.match(r'^\d+$', str(admin_cfg.get('form_id', ''))), 'enabled admin review must contain numeric Jotform form_id'
          else:
              assert not admin_cfg.get('form_id'), 'disabled admin review should not expose stale form id'

          assert 'receiver-config.json' in js
          assert 'config.enabled===true' in js
          assert 'manual-university' in html, 'generic Tokyo DB entry must allow one university-name input'
          assert 'この大学へ写真を送る' in html
          assert '/tools/university-database/tokyo/photo-submit/' in hub_html
          assert '/tools/university-database/tokyo/photo-register/' not in hub_html
          assert '補正・掲載写真の選択・大学DBへの登録はBan.Tai管理者が行います' in hub_html
          assert '/tools/university-database/tokyo/photo-submit/' in top_entry
          assert '大学写真を投稿' in top_entry
          assert 'detail-photo-submit-entry.js' in detail_html
          assert 'photo-submit/?university=' in detail_entry
          assert 'university_id' not in json.dumps(cfg, ensure_ascii=False)
          assert 'university_id' not in js
          assert 'university_id' not in detail_entry
          assert 'https://www.jotform.com/inbox/' in admin_js
          assert 'photo-review-config.json' in admin_js
          print('simple university photo submission guard: OK')
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/simple-photo-submit.log 2>&1 &
          sleep 2
      - name: Verify university handoff and simple UI
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('https://form.jotform.com/**',route=>route.abort());

            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-submit/?university=%E4%BA%9C%E7%B4%B0%E4%BA%9C%E5%A4%A7%E5%AD%A6',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#receiver-host iframe',{timeout:10000});
            assert.equal(await page.locator('#selected-university').innerText(),'亜細亜大学');
            let src=await page.locator('#receiver-host iframe').getAttribute('src');
            let url=new URL(src);
            assert.equal(url.searchParams.get('university'),'亜細亜大学');
            assert.equal(url.searchParams.has('university_id'),false);
            assert.equal((await page.locator('body').innerText()).includes('トリミング'),false);

            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-submit/',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#manual-university:not([hidden])',{timeout:10000});
            await page.fill('#university-name-input','亜細亜大学');
            await page.click('#university-continue');
            await page.waitForSelector('#receiver-host iframe',{timeout:10000});
            src=await page.locator('#receiver-host iframe').getAttribute('src');
            url=new URL(src);
            assert.equal(url.searchParams.get('university'),'亜細亜大学');
            assert.equal(url.searchParams.has('university_id'),false);

            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=u000094',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('.university-photo-submit-link',{timeout:15000});
            const href=await page.locator('.university-photo-submit-link').getAttribute('href');
            assert.ok(href.includes('photo-submit/?university='));
            assert.equal(href.includes('university_id='),false);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'no mobile horizontal overflow');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
