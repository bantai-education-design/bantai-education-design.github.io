name: Install Rikkyo owner photo

on:
  push:
    branches:
      - feature/rikkyo-owner-photo-20260823
    paths:
      - '.github/workflows/install-rikkyo-owner-photo.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/install-rikkyo-owner-photo.yml'
      - '.tmp/rikkyo-photo/**'

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'push' || github.head_ref == 'feature/rikkyo-owner-photo-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rikkyo-owner-photo-20260823
          fetch-depth: 0
      - name: Rebuild exact card JPEG from staged base64
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, re

          parts=[]
          for i in range(8):
              p=Path(f'.tmp/rikkyo-photo/chunk{i:02d}.b64')
              text=p.read_text(encoding='utf-8')
              cleaned=''.join(re.findall(r'[A-Za-z0-9+/=]', text))
              print(p, 'raw_chars=', len(text), 'base64_chars=', len(cleaned))
              parts.append(cleaned)

          encoded=''.join(parts)
          print('combined base64 chars=', len(encoded), 'mod4=', len(encoded)%4)
          raw=base64.b64decode(encoded, validate=True)
          out=Path('tools/university-database/tokyo/assets/card-images/rikkyo-university-bantai.jpg')
          out.write_bytes(raw)

          assert len(raw)==35673, len(raw)
          assert raw[:2]==b'\xff\xd8'
          assert raw[-2:]==b'\xff\xd9'
          assert hashlib.sha256(raw).hexdigest()=='5b23f9b26267e7b300f5a4a51bf7d6d404f5aceaf9445d36ee36d42656807b69'
          with Image.open(out) as im:
              assert im.size==(400,225), im.size
              assert im.format=='JPEG'
              im.load()
          print('Rikkyo owner photo rebuilt exactly:',len(raw),'bytes, 400x225')
          PY
      - name: Commit exact JPEG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/assets/card-images/rikkyo-university-bantai.jpg
          if git diff --cached --quiet; then
            echo 'JPEG already exact.'
            exit 0
          fi
          git commit -m 'fix: install complete Rikkyo owner photo JPEG'
          git push origin HEAD:feature/rikkyo-owner-photo-20260823
