name: Apply Tokyo photo batch 8 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch8-20260823]
    paths:
      - '.github/workflows/apply-photo-batch8-once.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch8-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add six verified real-photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const before=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(before!==27) throw new Error(`expected 27 verified photos before batch 8, got ${before}`);
          const records={
            u000006:{
              university_id:'u000006',university_name:'東京科学大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/1/18/West_Building_1_-_Ookayama_Campus%2C_the_Institute_of_Science_Tokyo.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:West_Building_1_-_Ookayama_Campus,_the_Institute_of_Science_Tokyo.jpg',
              source_label:'写真・ライセンス',creator:'Kakidai',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Kakidai、投稿者自身の作品、CC BY-SA 4.0を確認。東京科学大学大岡山キャンパス西1号館の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'東京科学大学大岡山キャンパス西1号館',reviewed_at:'2026-08-23'
            },
            u000010:{
              university_id:'u000010',university_name:'一橋大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/9/90/Hitotsubashi_University.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Hitotsubashi_University.jpg',
              source_label:'写真・ライセンス',creator:'Kakidai',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Kakidai、投稿者自身の作品、CC BY-SA 4.0を確認。一橋大学国立キャンパス旧門衛所の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'一橋大学国立キャンパスの旧門衛所',reviewed_at:'2026-08-23'
            },
            u000027:{
              university_id:'u000027',university_name:'國學院大學',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/6/66/%E5%9C%8B%E5%AD%B8%E9%99%A2%E5%A4%A7%E5%AD%B8%E7%A5%9E%E6%AE%BF%28%E6%B8%8B%E8%B0%B7%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%91%E3%82%B9%29.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:%E5%9C%8B%E5%AD%B8%E9%99%A2%E5%A4%A7%E5%AD%B8%E7%A5%9E%E6%AE%BF%28%E6%B8%8B%E8%B0%B7%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%91%E3%82%B9%29.jpg',
              source_label:'写真・ライセンス',creator:'しんぎんぐきゃっと',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者「しんぎんぐきゃっと」、投稿者自身の作品、CC BY-SA 4.0を確認。國學院大學渋谷キャンパス神殿の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'國學院大學渋谷キャンパスの神殿',reviewed_at:'2026-08-23'
            },
            u000078:{
              university_id:'u000078',university_name:'東京都市大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/b/b6/Tokyo_City_University%2C_Main_Campus.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Tokyo_City_University,_Main_Campus.jpg',
              source_label:'写真・ライセンス',creator:'Aw1805',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Aw1805、投稿者自身の作品、CC BY-SA 4.0を確認。東京都市大学メインキャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'東京都市大学のメインキャンパス',reviewed_at:'2026-08-23'
            },
            u000081:{
              university_id:'u000081',university_name:'明治学院大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/a/a3/Meijigakuin_university.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Meijigakuin_university.jpg',
              source_label:'写真・ライセンス',creator:'JCI-1127',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者JCI-1127、投稿者自身の作品、CC BY-SA 4.0を確認。明治学院大学白金キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'明治学院大学白金キャンパス',reviewed_at:'2026-08-23'
            },
            u000099:{
              university_id:'u000099',university_name:'成蹊大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/0/04/Seikei_University_%2810%29.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Seikei_University_(10).jpg',
              source_label:'写真・ライセンス',creator:'李維俊(alen2864)',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者李維俊(alen2864)、CC BY-SA 4.0、Wikimedia VRTによる許諾確認済みであることを確認。成蹊大学キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'成蹊大学キャンパスの実景',reviewed_at:'2026-08-23'
            }
          };
          for(const [id,row] of Object.entries(records)){
            if(data.images[id]?.rights_status==='verified') throw new Error(`${id} already verified`);
            data.images[id]=row;
          }
          const after=Object.values(data.images||{}).filter(x=>x.rights_status==='verified').length;
          if(after!==33) throw new Error(`expected 33 verified photos after batch 8, got ${after}`);
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log(`verified real university photos ${before} -> ${after}`);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git diff --cached --quiet && exit 1
          git commit -m 'Add six verified Tokyo university photos'
          git push origin HEAD:feature/tokyo-real-photos-batch8-20260823
