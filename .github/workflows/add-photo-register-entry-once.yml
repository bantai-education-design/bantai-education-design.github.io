name: Add university photo register entry once

on:
  push:
    branches: [feature/university-photo-quick-register-20260824]
    paths:
      - '.github/workflows/add-photo-register-entry-once.yml'

permissions:
  contents: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/university-photo-quick-register-20260824
          fetch-depth: 0
      - name: Add quick register entry to Tokyo DB header
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/index.html';
          let html=fs.readFileSync(path,'utf8');
          const marker='<a href="#fairness">掲載方針</a></nav>';
          const replacement='<a href="#fairness">掲載方針</a><a class="photo-register-entry" href="photo-register/" title="大学写真クイック登録">📷 写真登録</a></nav>';
          if(html.includes('class="photo-register-entry"')) throw new Error('photo register entry already exists');
          if(!html.includes(marker)) throw new Error('Tokyo header nav marker not found');
          html=html.replace(marker,replacement);
          html=html.replace('</head>','<style>.photo-register-entry{display:inline-flex;align-items:center;gap:.3rem;padding:.38rem .68rem;border:1px solid #b8943e;border-radius:999px;color:#f0d786!important;background:rgba(184,148,62,.1);font-weight:700;white-space:nowrap}.photo-register-entry:hover{background:rgba(184,148,62,.2)}@media(max-width:760px){.photo-register-entry{font-size:.78rem;padding:.3rem .55rem}}</style></head>');
          fs.writeFileSync(path,html);
          NODE
      - name: Commit entry link
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'ui: add university photo quick register entry'
          git push origin HEAD:feature/university-photo-quick-register-20260824
