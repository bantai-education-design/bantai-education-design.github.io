name: University academic UI guard
on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/**'
      - '.github/workflows/university-academic-ui-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/**'
      - '.github/workflows/university-academic-ui-guard.yml'

jobs:
  academic-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate overlay scripts
        run: |
          node --check tools/university-database/tokyo/assets/favorites.js
          node --check tools/university-database/tokyo/assets/card-finish.js
          node --check tools/university-database/tokyo/assets/detail-academic-baseline.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/university-site.log 2>&1 &
          sleep 2
      - name: Verify undergraduate and graduate-only UI
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const top=await browser.newPage({viewport:{width:1366,height:1000}});
            await top.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await top.waitForFunction(()=>document.documentElement.dataset.academicBaseline==='ready',{timeout:15000});
            await top.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,{timeout:15000});
            const teikyo=top.locator('.tokyo-card[data-id="u000102"]');
            const teikyoText=await teikyo.innerText();
            assert.ok(teikyoText.includes('学部 10'),teikyoText);
            assert.ok(teikyoText.includes('学科等 41'),teikyoText);
            const teikyoMap=decodeURIComponent(await teikyo.locator('.map-card-link').getAttribute('href'));
            assert.ok(teikyoMap.includes('帝京大学'),teikyoMap);
            const grips=top.locator('.tokyo-card[data-id="u000011"]');
            const gripsText=await grips.innerText();
            assert.ok(gripsText.includes('大学院大学 / 研究科 1'),gripsText);
            assert.ok(!gripsText.includes('学部 更新中'),gripsText);
            await top.setViewportSize({width:375,height:900});
            assert.equal(await top.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true);
            await top.close();

            const base='http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=';
            const normal=await browser.newPage({viewport:{width:1366,height:900}});
            await normal.goto(base+'u000098',{waitUntil:'networkidle'});
            await normal.waitForFunction(()=>document.querySelector('#detail-root')?.dataset.academicBaseline==='ready',{timeout:15000});
            const normalText=await normal.locator('body').innerText();
            for(const phrase of ['白百合女子大学','文学部','人間総合学部','国語国文学科','発達心理学科'])assert.ok(normalText.includes(phrase),`normal detail missing ${phrase}`);
            await normal.close();

            const grad=await browser.newPage({viewport:{width:1366,height:900}});
            await grad.goto(base+'u000011',{waitUntil:'networkidle'});
            await grad.waitForFunction(()=>document.querySelector('#detail-root')?.dataset.academicBaseline==='ready',{timeout:15000});
            const gradText=await grad.locator('body').innerText();
            for(const phrase of ['政策研究大学院大学','学部を置かない大学院大学です。','政策研究科'])assert.ok(gradText.includes(phrase),`graduate detail missing ${phrase}`);
            assert.ok(!gradText.includes('学部：情報更新中'),gradText);
            const gradMap=decodeURIComponent(await grad.locator('a',{hasText:'Google Maps'}).first().getAttribute('href'));
            assert.ok(gradMap.includes('政策研究大学院大学'),gradMap);
            await grad.close();
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
