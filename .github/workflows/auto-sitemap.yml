name: 新規アプリ・書籍・コラムのサイトマップ自動更新
on:
  push:
    branches: [main]
    paths:
      - 'products/*/index.html'
      - 'books/*/index.html'
      - 'columns/*/index.html'
      - 'scripts/update_sitemap_for_new_pages.py'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sitemap-auto-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax and smoke tests
        run: |
          python3 -m py_compile scripts/update_sitemap_for_new_pages.py
          python3 -m unittest discover -s tests -p 'test_sitemap_auto.py'
      - name: Add newly published page URLs
        run: python3 scripts/update_sitemap_for_new_pages.py
      - name: Commit sitemap only when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "サイトマップの変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sitemap.xml
          git commit -m "検索用サイトマップへ新しい公開ページを追加"
          git push
