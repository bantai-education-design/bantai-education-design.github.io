name: Apply final reviewed university Commons photos

on:
  push:
    branches:
      - feature/fill-remaining-university-photos-20260904
    paths:
      - 'tools/university-database/tokyo/data/university-images-commons-final-20260904.json'
      - '.github/workflows/apply-university-commons-final-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fill-remaining-university-photos-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge nine reviewed records into canonical registry
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const path='tools/university-database/tokyo/data/university-images.json';
          const batchPath='tools/university-database/tokyo/data/university-images-commons-final-20260904.json';
          const base=JSON.parse(fs.readFileSync(path,'utf8'));
          const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
          const records=batch.records||{};
          const expected=['u000069','u000087','u000090','u000091','u000092','u000105','u000124','u000131','u000134'];
          const ids=Object.keys(records).sort();
          assert.deepEqual(ids,[...expected].sort(),'final batch university IDs must match the reviewed nine');
          assert.equal(Object.keys(batch.unresolved||{}).length,1,'exactly one unresolved university must remain');
          assert.ok(batch.unresolved?.u000123,'LEC graduate school must be the single unresolved university');
          for(const [id,row] of Object.entries(records)){
            assert.equal(row.university_id,id,`${id}: university_id mismatch`);
            assert.equal(row.rights_status,'verified',`${id}: rights_status must be verified`);
            for(const key of ['university_name','image_url','source_url','source_label','creator','license','license_url','rights_note','alt','reviewed_at']){
              assert.ok(row[key],`${id}: missing ${key}`);
            }
            assert.ok(row.image_url.startsWith('https://upload.wikimedia.org/'),`${id}: image URL must be Wikimedia upload`);
            assert.ok(row.source_url.startsWith('https://commons.wikimedia.org/wiki/File:'),`${id}: source must be Commons file page`);
            assert.match(row.license,/^(CC0|CC BY|Public domain|Copyrighted free use)/i,`${id}: unsupported license ${row.license}`);
          }
          base.images=base.images||{};
          for(const [id,row] of Object.entries(records))base.images[id]=row;
          base.schema_version=Math.max(Number(base.schema_version)||0,4);
          fs.writeFileSync(path,JSON.stringify(base,null,2)+'\n');
          const verified=Object.values(base.images).filter(x=>x?.rights_status==='verified').length;
          assert.equal(verified,143,`verified real-photo coverage must be exactly 143, got ${verified}`);
          console.log(`merged=${ids.length} verified_real=${verified} unresolved=1`);
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/university-photo-site.log 2>&1 &
          sleep 2
      - name: Verify 143 list photos, reviewed records, detail and mobile
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          (async()=>{
            const batch=JSON.parse(fs.readFileSync('tools/university-database/tokyo/data/university-images-commons-final-20260904.json','utf8'));
            const ids=Object.keys(batch.records||{});
            assert.equal(ids.length,9,'nine reviewed final records required');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:950}});
            await page.goto('http://127.0.0.1:4173/tools/university-database/tokyo/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelectorAll('.tokyo-card[data-card-ready="true"]').length===144,{timeout:15000});
            await page.waitForFunction(()=>document.documentElement.dataset.userPhotoOverlay==='ready',{timeout:15000});
            assert.equal(await page.locator('.real-university-image').count(),143,'143 real university photo cards must render');
            for(const id of ids){
              const visual=page.locator(`.tokyo-card[data-id="${id}"] .real-university-image`);
              assert.equal(await visual.count(),1,`${id}: reviewed real photo must render`);
              const source=visual.locator('.image-source-link');
              assert.equal(await source.count(),1,`${id}: source link must render`);
              assert.ok((await source.getAttribute('href'))?.startsWith('https://commons.wikimedia.org/wiki/File:'),`${id}: Commons source href`);
            }
            assert.equal(await page.locator('.tokyo-card[data-id="u000123"] .real-university-image').count(),0,'LEC must remain without a verified real photo');
            const asiaSrc=await page.locator('.tokyo-card[data-id="u000094"] .university-card-image').getAttribute('src');
            assert.equal(asiaSrc,'assets/card-images/asia-university-bantai.jpg','Owner photo must remain highest priority on list');

            const detail=await browser.newPage({viewport:{width:1366,height:950}});
            await detail.goto('http://127.0.0.1:4173/tools/university-database/tokyo/detail.html?id=u000090',{waitUntil:'networkidle'});
            await detail.waitForFunction(()=>document.documentElement.dataset.detailPhotoSource==='registry',{timeout:15000});
            assert.equal(await detail.locator('.detail-owner-photo-gallery').count(),1,'Shizenkan canonical real photo must render on detail page');
            assert.ok((await detail.locator('.detail-owner-photo-main').getAttribute('src'))?.startsWith('https://upload.wikimedia.org/'),'Detail photo must use Wikimedia media');
            assert.ok((await detail.locator('.detail-photo-source-link').getAttribute('href'))?.startsWith('https://commons.wikimedia.org/wiki/File:'),'Detail must expose Commons source link');

            await page.setViewportSize({width:375,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+1),true,'No mobile horizontal overflow');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Commit canonical registry
        run: |
          if git diff --quiet -- tools/university-database/tokyo/data/university-images.json; then
            echo 'Canonical registry already contains all nine reviewed records.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/university-database/tokyo/data/university-images.json
          git commit -m 'data: publish reviewed university photos'
          git push origin HEAD:feature/fill-remaining-university-photos-20260904
