# Trigger CI check: IPSS 2035/2050 child population indices (PR #324 trigger)
name: University photo owner and overlap guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'

jobs:
  owner-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run owner and overlap audit
        run: node tools/university-database/tokyo/photo-register/verify-owner-overlap.mjs
