name: University photo owner and overlap guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'api/owner-photo-publish.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - 'api/owner-photo-publish.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'

jobs:
  owner-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install owner publish API dependencies
        run: npm ci
      - name: Validate owner publish source
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const loader=fs.readFileSync('tools/university-database/tokyo/photo-register/university-selection-sync-fix.js','utf8');
          const owner=fs.readFileSync('tools/university-database/tokyo/photo-register/owner-photo-register.js','utf8');
          const engine=fs.readFileSync('tools/university-database/tokyo/photo-register/owner-photo-set-export.js','utf8');
          const client=fs.readFileSync('tools/university-database/tokyo/photo-register/owner-publish-client.js','utf8');
          const api=fs.readFileSync('api/owner-photo-publish.js','utf8');
          const cfg=JSON.parse(fs.readFileSync('tools/university-database/tokyo/photo-register/owner-publish-config.json','utf8'));
          assert.ok(loader.includes('owner-publish-client.js'),'owner publish client must load in owner mode');
          assert.ok(owner.includes('この内容で掲載する'),'final owner action must be publish');
          assert.ok(owner.includes('写真を確認・追加・削除'),'owner must keep add/delete controls');
          assert.ok(owner.includes('必要なら写真を編集'),'owner must keep editor');
          assert.ok(owner.includes('ZIPの保存やChatGPTへの添付は不要'),'owner must not require package download');
          assert.ok(engine.includes("kind:'university_owner_direct_publish'"),'engine must create direct publish manifest');
          assert.ok(engine.includes('getExcludedPhotos'),'deleted existing photos must affect publish data');
          assert.ok(engine.includes('delete records[id]'),'removing all owner photos must remove the override record');
          assert.ok(engine.includes('blobToBase64'),'edited JPEGs must be transferable to the publish API');
          assert.ok(client.includes('waitForPages'),'client must verify GitHub Pages reflection');
          assert.ok(api.includes('OWNER_PUBLISH_GITHUB_TOKEN'),'GitHub credential must be read only on the server');
          assert.ok(api.includes('universities_tokyo_all.generated.json'),'server must use a university ID allowlist');
          assert.ok(api.includes('validateImages'),'server must validate image files');
          assert.ok(api.includes('sharp('),'server must decode uploaded images');
          assert.ok(api.includes('720×405 JPEG'),'server must require the published card dimensions');
          assert.ok(api.includes("base: 'main', draft: true"),'server must create a Draft PR instead of writing main');
          assert.ok(api.includes('base_owner_record'),'server must reject stale owner edits');
          assert.equal(cfg.enabled,false,'publish API must stay disabled until server secrets and E2E are verified');
          const publicSource=[JSON.stringify(cfg),client,engine].join('\n').toLowerCase();
          assert.equal(/github[_-]?(token|pat)|ghp_[a-z0-9]+/.test(publicSource),false,'no GitHub secret may be stored in public files');
          console.log('owner edit/direct-publish source validated');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/photo-owner-overlap.log 2>&1 &
          sleep 2
      - name: Verify owner add delete edit main and publish payload
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const png1=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mP8z8AARMAgYKSAAAMAAgAB9HFkzgAAAABJRU5ErkJggg==','base64');
          const png2=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNk+M/AAETAIGCkgAADAAIAAfRxZM4AAAAASUVORK5CYII=','base64');
          fs.writeFileSync('/tmp/owner-a.png',png1);
          fs.writeFileSync('/tmp/owner-b.png',png2);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const owner=await browser.newPage({viewport:{width:1366,height:1000}});
            await owner.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/?mode=owner',{waitUntil:'networkidle'});
            await owner.waitForFunction(()=>document.documentElement.dataset.communityUiSequence==='owner-ready'&&document.documentElement.dataset.ownerPhotoSetEngine==='ready'&&document.documentElement.dataset.ownerPublishClient==='ready',null,{timeout:15000});
            assert.equal(await owner.locator('#generate-batch').innerText(),'この内容で掲載する');
            assert.equal(await owner.locator('#download-zip').isVisible(),false,'ZIP button must be hidden');
            assert.equal(await owner.locator('#download-json').isVisible(),false,'JSON download must be hidden');
            assert.equal(await owner.locator('#copy-json').isVisible(),false,'JSON copy must be hidden');

            await owner.locator('#university-first-select').selectOption('u000094');
            await owner.waitForFunction(()=>document.querySelector('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]'),null,{timeout:10000});
            const oldCard=owner.locator('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]');
            await oldCard.locator('xpath=..').locator('.photo-list-delete').click();
            await owner.waitForTimeout(100);
            assert.equal(await owner.locator('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]').count(),0,'deleted old owner photo must leave picker');

            await owner.setInputFiles('#photo-input',['/tmp/owner-a.png','/tmp/owner-b.png']);
            await owner.waitForFunction(()=>document.querySelectorAll('#batch-list .batch-row').length===2,null,{timeout:10000});
            await owner.waitForFunction(()=>document.documentElement.dataset.ownerPhotoSetReady==='true',null,{timeout:10000});
            assert.equal(await owner.locator('#batch-status').innerText(),'掲載後 2枚（メイン1＋サブ1）');

            const newChoices=owner.locator('.main-photo-choice-card[data-main-type="new"]');
            await owner.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card[data-main-type="new"]').length===2,null,{timeout:10000});
            await newChoices.nth(1).click();

            const payload=await owner.evaluate(()=>window.__ownerPhotoSetExport.buildPublishPayload());
            assert.equal(payload.kind,'bantai_university_owner_publish');
            assert.equal(payload.university_id,'u000094');
            assert.equal(payload.manifest.kind,'university_owner_direct_publish');
            assert.ok(payload.manifest.deleted_image_urls.includes('assets/card-images/asia-university-bantai.jpg'));
            const registryFile=payload.files.find(file=>file.path.endsWith('/data/user-photo-overrides.json'));
            assert.ok(registryFile);
            const output=JSON.parse(registryFile.content);
            const record=output.records.u000094;
            assert.ok(record);
            assert.equal(record.image_url.includes('-owner-02.jpg'),true,'selected second new photo must become main');
            assert.equal(record.gallery.length,1);
            assert.equal(record.gallery[0].image_url.includes('-owner-01.jpg'),true);
            assert.equal(JSON.stringify(record).includes('asia-university-bantai.jpg'),false,'deleted old photo must not survive in main/gallery');
            const jpgFiles=payload.files.filter(file=>file.path.endsWith('.jpg'));
            assert.equal(jpgFiles.length,2,'both edited JPEGs must be ready for server publish');
            assert.ok(jpgFiles.every(file=>file.encoding==='base64'&&file.content_type==='image/jpeg'&&file.content.length>0));
            assert.ok(payload.request_id,'the request must have an idempotency key');

            const cfg=await owner.evaluate(()=>window.__ownerPublishClient.config());
            assert.equal(cfg.enabled,false);
            const disabledMessage=await owner.evaluate(async payload=>{
              try{await window.__ownerPublishClient.publish(payload);return '';}
              catch(error){return error.message;}
            },payload);
            assert.ok(disabledMessage.includes('掲載APIは準備中'),'disabled server must fail safely without changing public DB');
            assert.equal(await owner.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            const mobile=await browser.newPage({viewport:{width:375,height:812}});
            await mobile.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/?mode=owner',{waitUntil:'networkidle'});
            await mobile.waitForFunction(()=>document.documentElement.dataset.communityUiSequence==='owner-ready',null,{timeout:15000});
            assert.equal(await mobile.locator('#generate-batch').innerText(),'この内容で掲載する');
            assert.equal(await mobile.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'375px owner screen must not horizontally overflow');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
