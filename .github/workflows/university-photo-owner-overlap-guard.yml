name: University photo owner and overlap guard

on:
  pull_request:
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/university-database/tokyo/photo-register/**'
      - '.github/workflows/university-photo-owner-overlap-guard.yml'

jobs:
  owner-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source separation
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const index=fs.readFileSync('tools/university-database/tokyo/photo-register/index.html','utf8');
          const loader=fs.readFileSync('tools/university-database/tokyo/photo-register/university-selection-sync-fix.js','utf8');
          const css=fs.readFileSync('tools/university-database/tokyo/photo-register/photo-register-mode-fix.css','utf8');
          const owner=fs.readFileSync('tools/university-database/tokyo/photo-register/owner-photo-register.js','utf8');
          const ownerSet=fs.readFileSync('tools/university-database/tokyo/photo-register/owner-photo-set-export.js','utf8');
          assert.ok(loader.includes("get('mode')==='owner'"),'owner mode query required');
          assert.ok(loader.includes('owner-photo-set-export.js'),'owner photo set exporter must load only in owner branch');
          assert.ok(loader.includes("dataset.communityUiSequence='owner-ready'"),'owner mode must bypass community submission UI');
          assert.match(css,/community-simple-submission \.export-panel\{[\s\S]*position:static!important/,'community submit panel must not stay sticky');
          assert.ok(css.includes('body.community-photo-submission .policy{display:block!important}'),'public mode must keep top posting rules visible after JS init');
          assert.ok(!css.includes('body.owner-photo-registration .policy{display:none'),'owner mode must keep posting rules visible');
          assert.ok(index.indexOf('class="policy panel"')>index.indexOf('class="hero"'),'rules must follow hero');
          assert.ok(index.indexOf('class="policy panel"')<index.indexOf('class="batch panel"'),'rules must appear before registration controls');
          assert.ok(index.includes('登録前にご確認ください　大学写真 投稿・掲載ルール'),'top rules heading required');
          assert.ok(owner.includes('Ban.Tai 本人撮影写真を登録'),'owner title required');
          assert.ok(owner.includes('この内容で大学DBへ登録'),'owner direct preparation label required');
          assert.ok(ownerSet.includes("kind:'university_owner_photo_set'"),'owner exporter must create photo-set manifest');
          assert.ok(ownerSet.includes("replacement_mode:'authoritative_photo_set'"),'owner photo set must replace the old set authoritatively');
          assert.ok(ownerSet.includes('gallery'),'owner photo set must write gallery');
          assert.ok(ownerSet.includes('getExcludedPhotos'),'deleted existing photos must affect export');
          assert.ok(ownerSet.includes('delete records[id]'),'removing all owner photos must remove the owner override record');
          console.log('owner/public separation and photo-set source validated');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/photo-owner-overlap.log 2>&1 &
          sleep 2
      - name: Verify public no-overlap and owner photo-set replacement
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const png1=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mP8z8AARMAgYKSAAAMAAgAB9HFkzgAAAABJRU5ErkJggg==','base64');
          const png2=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mNk+M/AAETAIGCkgAADAAIAAfRxZM4AAAAASUVORK5CYII=','base64');
          fs.writeFileSync('/tmp/owner-a.png',png1);
          fs.writeFileSync('/tmp/owner-b.png',png2);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const publicPage=await browser.newPage({viewport:{width:1366,height:900}});
            await publicPage.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/',{waitUntil:'networkidle'});
            await publicPage.waitForFunction(()=>document.documentElement.dataset.communityUiSequence==='ready',null,{timeout:15000});
            await publicPage.waitForTimeout(300);
            assert.equal(await publicPage.locator('.policy').isVisible(),true,'public rules must remain visible after community JS initialization');
            assert.equal(await publicPage.locator('script[data-owner-photo-set-export]').count(),0,'public visitor mode must not load owner exporter');
            const publicOrder=await publicPage.evaluate(()=>{
              const main=document.querySelector('main.wrap');
              const children=[...main.children];
              return {hero:children.indexOf(document.querySelector('.hero')),policy:children.indexOf(document.querySelector('.policy')),batch:children.indexOf(document.querySelector('.batch'))};
            });
            assert.ok(publicOrder.hero>=0&&publicOrder.policy===publicOrder.hero+1&&publicOrder.batch===publicOrder.policy+1,'public rules must be immediately below hero and before registration');
            const toggle=publicPage.locator('#community-editor-toggle');
            await toggle.click();
            await publicPage.waitForFunction(()=>!document.querySelector('#photo-editor')?.hidden,null,{timeout:5000});
            const layout=await publicPage.evaluate(()=>{
              const editor=document.querySelector('#photo-editor');
              const panel=document.querySelector('.export-panel');
              return {position:getComputedStyle(panel).position,editorBottom:editor.getBoundingClientRect().bottom+scrollY,panelTop:panel.getBoundingClientRect().top+scrollY};
            });
            assert.notEqual(layout.position,'sticky','STEP 4 must not float over editor');
            assert.ok(layout.panelTop>=layout.editorBottom-1,'STEP 4 must follow editor in document flow');

            const owner=await browser.newPage({viewport:{width:1366,height:1000},acceptDownloads:true});
            await owner.goto('http://127.0.0.1:4173/tools/university-database/tokyo/photo-register/?mode=owner',{waitUntil:'networkidle'});
            await owner.waitForFunction(()=>document.documentElement.dataset.communityUiSequence==='owner-ready'&&document.documentElement.dataset.ownerPhotoSetEngine==='ready',null,{timeout:15000});
            assert.equal(await owner.locator('body').evaluate(el=>el.classList.contains('owner-photo-registration')),true);
            assert.equal(await owner.locator('#community-photo-rules').count(),0,'owner mode must not show community agreement checkboxes');
            assert.equal(await owner.locator('#community-submit-package').count(),0,'owner mode must not show review submit button');
            assert.equal(await owner.locator('#generate-batch').isVisible(),true,'owner registration button must be visible');
            assert.equal(await owner.locator('#generate-batch').innerText(),'この内容で大学DBへ登録');
            assert.ok((await owner.locator('.hero h1').innerText()).includes('本人撮影写真'));
            assert.equal(await owner.locator('#registration-mode-switch').isVisible(),false,'legacy mode switch stays hidden in owner quick flow');
            assert.equal(await owner.locator('.policy').isVisible(),true,'owner mode must keep posting rules visible');

            await owner.locator('#university-first-select').selectOption('u000094');
            await owner.waitForFunction(()=>document.querySelector('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]'),null,{timeout:10000});
            const oldCard=owner.locator('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]');
            assert.equal(await oldCard.count(),1,'current Asia owner photo must be visible before deletion');
            await oldCard.locator('xpath=..').locator('.photo-list-delete').click();
            await owner.waitForTimeout(100);
            assert.equal(await owner.locator('.main-photo-choice-card[data-main-key="assets/card-images/asia-university-bantai.jpg"]').count(),0,'deleted existing owner photo must leave the picker');

            await owner.setInputFiles('#photo-input',['/tmp/owner-a.png','/tmp/owner-b.png']);
            await owner.waitForFunction(()=>document.querySelectorAll('#batch-list .batch-row').length===2,null,{timeout:10000});
            await owner.waitForFunction(()=>[...document.querySelectorAll('#batch-list .row-university')].every(x=>x.value==='u000094'),null,{timeout:10000});
            await owner.waitForFunction(()=>document.documentElement.dataset.ownerPhotoSetReady==='true'&&!document.querySelector('#generate-batch').disabled,null,{timeout:10000});
            assert.equal(await owner.locator('#batch-status').innerText(),'登録後 2枚（メイン1＋サブ1）');

            const newChoices=owner.locator('.main-photo-choice-card[data-main-type="new"]');
            await owner.waitForFunction(()=>document.querySelectorAll('.main-photo-choice-card[data-main-type="new"]').length===2,null,{timeout:10000});
            await newChoices.nth(1).click();
            const secondKey=await newChoices.nth(1).getAttribute('data-main-key');
            assert.ok(secondKey);

            const downloadPromise=owner.waitForEvent('download');
            await owner.locator('#generate-batch').click();
            const download=await downloadPromise;
            assert.match(download.suggestedFilename(),/^university-owner-photo-set-u000094-\d{4}-\d{2}-\d{2}\.zip$/);
            await owner.waitForFunction(()=>document.documentElement.dataset.ownerPhotoSetExport==='saved',null,{timeout:15000});

            const output=JSON.parse(await owner.locator('#json-output').inputValue());
            const record=output.records.u000094;
            assert.ok(record,'Asia owner record must remain after adding replacement photos');
            assert.equal(record.image_url.includes('-owner-02.jpg'),true,'selected second new photo must become main');
            assert.equal(Array.isArray(record.gallery),true);
            assert.equal(record.gallery.length,1,'one remaining new photo must be sub');
            assert.equal(record.gallery[0].image_url.includes('-owner-01.jpg'),true);
            const serialized=JSON.stringify(record);
            assert.equal(serialized.includes('asia-university-bantai.jpg'),false,'deleted old owner photo must not survive as main or sub');
            const manifest=await owner.evaluate(()=>window.__ownerPhotoSetLastManifest);
            assert.ok(manifest.deleted_image_urls.includes('assets/card-images/asia-university-bantai.jpg'),'manifest must audit deleted old photo');
            assert.equal(manifest.main_image_url,record.image_url);
            assert.deepEqual(manifest.gallery_image_urls,record.gallery.map(x=>x.image_url));
            assert.equal(await owner.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE