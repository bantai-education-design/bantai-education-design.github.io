name: Apply Tokyo photo batch 6 once

on:
  push:
    branches: [feature/tokyo-real-photos-batch6-20260823]
    paths:
      - '.github/workflows/apply-photo-batch6-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tokyo-real-photos-batch6-20260823
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add six verified university photo records
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tools/university-database/tokyo/data/university-images.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const records={
            u000022:{
              university_id:'u000022',university_name:'学習院大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/8/80/Gakushuin_University_Hyakunen_Kaikan_and_ground.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Gakushuin_University_Hyakunen_Kaikan_and_ground.jpg',
              source_label:'写真・ライセンス',creator:'Gotanda',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Gotanda、投稿者自身の作品、CC BY-SA 4.0を確認。学習院大学キャンパスの百周年記念会館とグラウンドの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'学習院大学キャンパスの百周年記念会館とグラウンド',reviewed_at:'2026-08-23'
            },
            u000029:{
              university_id:'u000029',university_name:'駒澤大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/3/3b/Komazawa_University.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Komazawa_University.jpg',
              source_label:'写真・ライセンス',creator:'Sevent+heaven',license:'CC0 1.0',license_url:'https://creativecommons.org/publicdomain/zero/1.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで駒澤大学正門写真がCC0 1.0で公開されていることを確認。作者表記と原画像、再利用条件を追跡できる状態で掲載する。',
              alt:'駒澤大学正門',reviewed_at:'2026-08-23'
            },
            u000043:{
              university_id:'u000043',university_name:'専修大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/a/a2/Senshu_University_Kanda_Campus.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:Senshu_University_Kanda_Campus.jpg',
              source_label:'写真・ライセンス',creator:'Sinet',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者Sinet、CC BY-SA 3.0を確認。東京都千代田区の専修大学神田キャンパス実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'専修大学神田キャンパス',reviewed_at:'2026-08-23'
            },
            u000063:{
              university_id:'u000063',university_name:'東洋大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/b/b6/Toyo_University_Hakusan_Campus.png',
              source_url:'https://commons.wikimedia.org/wiki/File:Toyo_University_Hakusan_Campus.png',
              source_label:'写真・ライセンス',creator:'36 Komaken',license:'CC BY-SA 4.0',license_url:'https://creativecommons.org/licenses/by-sa/4.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者36 Komaken、投稿者自身の作品、CC BY-SA 4.0を確認。東洋大学白山キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'東洋大学白山キャンパス',reviewed_at:'2026-08-23'
            },
            u000097:{
              university_id:'u000097',university_name:'国際基督教大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/d/da/International_Christian_University%2C_Mitaka%2C_Tokyo%2C_Japan.jpg',
              source_url:'https://commons.wikimedia.org/wiki/File:International_Christian_University,_Mitaka,_Tokyo,_Japan.jpg',
              source_label:'写真・ライセンス',creator:'John Paul Antes',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページで作者John Paul Antes、投稿者自身の作品、CC BY-SA 3.0を確認。国際基督教大学三鷹キャンパスの実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'国際基督教大学三鷹キャンパスの校舎',reviewed_at:'2026-08-23'
            },
            u000101:{
              university_id:'u000101',university_name:'津田塾大学',rights_status:'verified',
              image_url:'https://upload.wikimedia.org/wikipedia/commons/f/f1/Tsudajukuuniv.JPG',
              source_url:'https://commons.wikimedia.org/wiki/File:Tsudajukuuniv.JPG',
              source_label:'写真・ライセンス',creator:'Hykw-a4',license:'CC BY-SA 3.0',license_url:'https://creativecommons.org/licenses/by-sa/3.0/',
              rights_note:'Wikimedia Commonsの個別ファイルページと原投稿ログで、原投稿者Hykw-a4による撮影、CC BY-SA 3.0を確認。津田塾大学の実景写真として、作者・ライセンス・原画像を追跡できる状態で掲載する。',
              alt:'津田塾大学小平キャンパス',reviewed_at:'2026-08-23'
            }
          };
          data.images={...(data.images||{}),...records};
          const sorted=Object.fromEntries(Object.entries(data.images).sort(([a],[b])=>a.localeCompare(b)));
          data.images=sorted;
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          const verified=Object.values(data.images).filter(x=>x.rights_status==='verified');
          if(verified.length!==21)throw new Error(`verified photo count ${verified.length}, expected 21`);
          for(const id of Object.keys(records))if(!data.images[id])throw new Error(`missing ${id}`);
          console.log('verified university photos after batch 6:',verified.length);
          NODE
      - name: Commit generated registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/university-database/tokyo/data/university-images.json
          git commit -m "data: add verified Tokyo university photos batch 6"
          git push origin HEAD:feature/tokyo-real-photos-batch6-20260823
