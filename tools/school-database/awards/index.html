    <section class="nat-hero">
      <div class="nat-kicker">NATIONWIDE SCHOOL AWARDS SEARCH</div>
      <h1>全国横断 スポーツ・武道・文化部・音楽 実績校検索</h1>
      <p>47都道府県をまたいで、スポーツ・武道・文化部・検定（漢検）・音楽コンクールの全国大会実績校を一括検索できます。都道府県を「全国」のまま競技・分野で絞り込むことも、特定の都道府県で比較することもできます。</p>

      <button type="button" class="nat-tab" data-tab="music">音楽コンクール</button>
    </div>

    <section class="nat-controls" aria-label="検索フィルター">
      <div>
        <label for="nat-keyword">フリーワード検索（学校名・競技・大会・賞・地域）</label>
        <input type="search" id="nat-keyword" placeholder="例：甲子園、柔道、演劇、漢検、吹奏楽、大阪桐蔭 など">
      </div>
      <div>
        <label for="nat-pref">都道府県</label>
        <select id="nat-pref">
          <option value="">全国（47都道府県すべて）</option>
        </select>
      </div>
      <div>
        <label for="nat-category">競技・分野・大会で絞り込み</label>
        <select id="nat-category">
          <option value="">すべての競技・分野</option>
        </select>
      </div>
