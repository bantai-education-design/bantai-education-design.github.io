*{box-sizing:border-box}body{margin:0;background:#fff}.master-stage{background:#031b2f}.master-art{position:relative;width:min(1536px,100%);margin:auto;aspect-ratio:3/2;background:#031b2f;overflow:hidden}.master-art img{display:block;width:100%;height:100%;object-fit:contain}.master-hotspot{position:absolute;display:block;z-index:2;border-radius:18px;outline:2px solid transparent}.master-hotspot:hover,.master-hotspot:focus-visible{outline-color:#ffd878;box-shadow:0 0 0 4px rgba(255,216,120,.2)}.school-card{left:45.7%;top:18.4%;width:15.3%;height:19.8%}.textbook-card{left:77.7%;top:18.9%;width:17.8%;height:18.8%}.university-card{left:77.8%;top:41.1%;width:18%;height:19.7%}.school-button{left:4.2%;top:54.3%;width:11.5%;height:6.3%;border-radius:999px}.textbook-button{left:15.8%;top:54.3%;width:16.3%;height:6.3%;border-radius:999px}.university-button{left:32.7%;top:54.3%;width:11.8%;height:6.3%;border-radius:999px}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#f2c45c;font-weight:700;letter-spacing:.08em}.master-art.ready .loading{display:none}@media(max-width:680px){.master-art{overflow-x:auto;aspect-ratio:auto}.master-art img{width:100%;height:auto;min-width:760px}.master-hotspot{display:none}}

<script>
(async()=>{try{const base='/assets/images/databases-gateway/';const parts=await Promise.all(['master.b64.00.txt','master.b64.01.txt'].map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const img=document.getElementById('masterImage');img.onload=()=>document.getElementById('masterArt').classList.add('ready');img.src='data:image/jpeg;base64,'+parts.join('').replace(/\s+/g,'')}catch(e){document.querySelector('.loading').textContent='原画像の読み込みに失敗しました';console.error(e)}})();
</script>
