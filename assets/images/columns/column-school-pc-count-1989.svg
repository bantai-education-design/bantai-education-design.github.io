<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#fbfaf7"/><rect width="1200" height="120" fill="#111"/><text x="65" y="76" fill="#f3d77e" font-family="serif" font-size="48">1989年 導入校の平均設置台数</text><text x="65" y="150" fill="#555" font-family="sans-serif" font-size="24">1989年3月時点</text><g transform="translate(70 220)"><rect width="320" height="420" rx="22" fill="#fff" stroke="#c5a059" stroke-width="4"/><text x="95" y="70" font-family="serif" font-size="34">小学校</text><text x="72" y="185" fill="#a87e23" font-family="serif" font-size="92" font-weight="700">3.0</text><text x="242" y="185" font-size="34">台</text><rect x="85" y="255" width="150" height="120" fill="#c5a059"/></g><g transform="translate(440 220)"><rect width="320" height="420" rx="22" fill="#fff" stroke="#c5a059" stroke-width="4"/><text x="95" y="70" font-family="serif" font-size="34">中学校</text><text x="72" y="185" fill="#a87e23" font-family="serif" font-size="92" font-weight="700">4.3</text><text x="242" y="185" font-size="34">台</text><rect x="85" y="205" width="150" height="170" fill="#c5a059"/></g><g transform="translate(810 220)"><rect width="320" height="420" rx="22" fill="#111" stroke="#c5a059" stroke-width="4"/><text x="46" y="72" fill="#fff" font-family="serif" font-size="32">主な設置場所</text><text x="86" y="145" fill="#fff" font-family="serif" font-size="40">職員室</text><text x="48" y="270" fill="#f2d273" font-family="serif" font-size="86" font-weight="700">60.4</text><text x="245" y="270" fill="#fff" font-size="34">%</text><text x="55" y="345" fill="#d8d0bf" font-family="sans-serif" font-size="22">「学校にある」≠「一人1台」</text></g><text x="70" y="720" fill="#4a4031" font-family="serif" font-size="30">設置校でも、小中学校では数台を共有する時代だった。</text></svg>