<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8f5ee"/><text x="65" y="90" font-size="43" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">全国の書店数は約28年で6割近く減少</text><text x="85" y="185" font-size="29" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">1998年</text><text x="300" y="185" font-size="43" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">24,237店</text><rect x="85" y="225" width="1020" height="95" rx="14" fill="#315f80"/><text x="85" y="410" font-size="29" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">2026年3月末</text><text x="300" y="410" font-size="43" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">9,993店</text><rect x="85" y="445" width="421" height="95" rx="14" fill="#b87d45"/><text x="85" y="625" font-size="22" font-family="Noto Sans JP, sans-serif" font-weight="bold" fill="#17334e">出典：日本出版インフラセンター／書店マスタ管理センター</text></svg>