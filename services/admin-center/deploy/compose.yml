name: bantai-admin-center
services:
  admin:
    build:
      context: ../../..
      dockerfile: services/admin-center/deploy/Dockerfile
    image: bantai-admin-center:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 2m
    environment:
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?管理用ホスト名を設定してください}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/password_hash
      ADMIN_GITHUB_TOKEN_FILE: /run/secrets/github_token
    secrets: [password_hash, github_token]
    volumes:
      - admin-data:/var/lib/bantai-admin
      - admin-backups:/var/backups/bantai-admin
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    networks: [private]
  proxy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?管理用ホスト名を設定してください}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    depends_on:
      admin:
        condition: service_healthy
    networks: [private]
networks:
  private:
volumes:
  admin-data:
  admin-backups:
  caddy-data:
  caddy-config:
secrets:
  password_hash:
    file: ${ADMIN_SECRET_DIR:?リポジトリ外の秘密ファイルディレクトリを設定してください}/password-hash
  github_token:
    file: ${ADMIN_SECRET_DIR:?リポジトリ外の秘密ファイルディレクトリを設定してください}/github-token
